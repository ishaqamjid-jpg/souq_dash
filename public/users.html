<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة موظفي النظام | Souq app</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .hidden-element { display: none !important; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); }
        .fab-button { position: fixed; bottom: 2rem; left: 2rem; z-index: 40; }
    </style>
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden">

    <aside class="w-64 bg-gray-900 text-white flex flex-col shrink-0 shadow-lg z-20">
        <div class="h-16 flex items-center justify-center font-black text-2xl bg-gray-950 border-b border-gray-800">Souq app</div>
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <a href="dashboard.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">الرئيسية</a>
            <a href="orders.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">إدارة الطلبات</a>
            <a href="reports.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">التقارير والإحصائيات</a>
            <a href="ads.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">إدارة الإعلانات</a>
            <a href="trader.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">إدارة التجار</a>
            <a href="clients.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">عملاء التطبيق</a>
            <a href="constant.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">إدارة الثوابت</a>
            <a href="users.html" class="block px-4 py-3 bg-blue-600 shadow-md rounded-lg transition-colors font-bold">موظفو النظام</a>
        </nav>
        <div class="p-4 border-t border-gray-800">
            <a href="index.html" class="block w-full bg-red-600 text-center hover:bg-red-700 text-white font-bold py-2.5 rounded-lg transition-colors shadow">تسجيل الخروج</a>
        </div>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden relative">
        <header class="h-16 bg-[#0D1B6D] text-white shadow-sm flex items-center justify-between px-8 shrink-0 z-10">
            <h2 class="text-xl font-bold">إدارة موظفي النظام</h2>
            <div class="flex items-center gap-6">
                <div class="bg-white/20 px-4 py-1.5 rounded-full font-bold text-sm">الإجمالي: <span id="total-count">0</span></div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto bg-gray-50 p-6 relative">
            <div class="max-w-5xl mx-auto mb-6 relative">
                <i class="fas fa-search absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="search-input" onkeyup="renderUsers()" placeholder="ابحث باسم الموظف أو رقم الهاتف..." class="w-full bg-white border border-gray-200 text-gray-900 rounded-xl shadow-sm focus:ring-[#0D1B6D] focus:border-[#0D1B6D] block pr-12 p-3.5 outline-none transition-colors">
            </div>
            <div id="usersContainer" class="max-w-5xl mx-auto space-y-4 pb-24"></div>
        </main>

        <button onclick="openUserModal()" class="fab-button w-14 h-14 bg-[#4CAF50] hover:bg-green-600 text-white rounded-full shadow-lg flex items-center justify-center transition-transform hover:scale-105">
            <i class="fas fa-user-plus text-xl"></i>
        </button>
    </div>

    <!-- نافذة إضافة / تعديل موظف -->
    <div id="user-modal" class="fixed inset-0 modal-overlay z-50 hidden-element flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto flex flex-col">
            <div class="p-6 border-b border-gray-200 flex justify-between items-center sticky top-0 bg-white z-10">
                <h3 id="modal-title" class="text-xl font-bold text-[#0D1B6D]">إضافة موظف جديد</h3>
                <button onclick="closeModal('user-modal')" class="text-gray-400 hover:text-red-500 transition-colors"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="user-id">
                <div><label class="block text-sm font-bold text-gray-700 mb-1">الاسم الكامل <span class="text-red-500">*</span></label><input type="text" id="user-name" class="w-full border border-gray-300 p-2.5 rounded-lg focus:outline-none focus:border-[#0D1B6D]"></div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label class="block text-sm font-bold text-gray-700 mb-1">رقم الهاتف <span class="text-red-500">*</span></label><input type="tel" id="user-phone" class="w-full border border-gray-300 p-2.5 rounded-lg focus:outline-none focus:border-[#0D1B6D] text-left" dir="ltr"></div>
                    <div><label class="block text-sm font-bold text-gray-700 mb-1">كلمة المرور <span class="text-red-500">*</span></label><input type="text" id="user-pass" class="w-full border border-gray-300 p-2.5 rounded-lg focus:outline-none focus:border-[#0D1B6D] text-left" dir="ltr"></div>
                </div>

                <div><label class="block text-sm font-bold text-gray-700 mb-1">البريد الإلكتروني (Email)</label><input type="email" id="user-email" class="w-full border border-gray-300 p-2.5 rounded-lg focus:outline-none focus:border-[#0D1B6D] text-left" dir="ltr"></div>
                <div><label class="block text-sm font-bold text-gray-700 mb-1">FCM Token (للإشعارات)</label><input type="text" id="user-fcm" class="w-full border border-gray-300 p-2.5 rounded-lg focus:outline-none focus:border-[#0D1B6D]"></div>

                <div class="border-t border-gray-100 pt-4 mt-2">
                    <label class="block text-sm font-bold text-gray-700 mb-2">الصلاحية:</label>
                    <div class="flex gap-6">
                        <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="user-perm" value="admin" class="w-4 h-4 text-[#0D1B6D]"><span class="font-bold text-[#0D1B6D]">مدير (Admin)</span></label>
                        <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="user-perm" value="employee" checked class="w-4 h-4 text-[#0D1B6D]"><span class="font-bold text-gray-600">موظف (Employee)</span></label>
                    </div>
                </div>

                <div class="border-t border-gray-100 pt-4 mt-2">
                    <label class="block text-sm font-bold text-gray-700 mb-2">حالة الحساب:</label>
                    <div class="flex gap-6">
                        <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="user-status" value="active" checked class="w-4 h-4 text-green-600"><span class="font-bold text-green-600">نشط</span></label>
                        <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="user-status" value="not_active" class="w-4 h-4 text-red-600"><span class="font-bold text-red-600">موقوف</span></label>
                    </div>
                </div>
            </div>
            <div class="p-6 border-t border-gray-200 bg-gray-50 flex justify-end gap-3 rounded-b-2xl sticky bottom-0">
                <button onclick="closeModal('user-modal')" class="px-6 py-2.5 text-gray-600 font-bold hover:bg-gray-200 rounded-lg">إلغاء</button>
                <button onclick="saveUser()" class="px-8 py-2.5 bg-[#0D1B6D] text-white font-bold rounded-lg shadow-md hover:bg-blue-900">حفظ</button>
            </div>
        </div>
    </div>

    <!-- نافذة تأكيد الحذف والإشعار -->
    <div id="delete-modal" class="fixed inset-0 modal-overlay z-50 hidden-element flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 text-center">
            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4"><i class="fas fa-exclamation-triangle text-3xl text-red-600"></i></div>
            <h3 class="text-xl font-bold text-gray-800 mb-2">تأكيد الحذف</h3>
            <p class="text-gray-500 mb-6" id="delete-message">هل أنت متأكد من رغبتك في حذف هذا الموظف نهائياً؟</p>
            <div class="flex gap-3 justify-center">
                <button onclick="closeModal('delete-modal')" class="flex-1 px-4 py-2 text-gray-600 font-bold bg-gray-100 rounded-lg">إلغاء</button>
                <button id="confirm-delete-btn" class="flex-1 px-4 py-2 bg-red-600 text-white font-bold hover:bg-red-700 rounded-lg">حذف</button>
            </div>
        </div>
    </div>

    <div id="toast-message" class="fixed top-4 left-1/2 transform -translate-x-1/2 text-white px-6 py-3 rounded-xl shadow-lg hidden-element transition-opacity z-50 flex items-center gap-3">
        <i id="toast-icon" class="fas fa-check-circle text-xl"></i> <span id="toast-text" class="font-bold"></span>
    </div>

    <!-- استدعاء الفايربيس والمصادقة -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script> <!-- السطر المضاف -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyA-ta3tPT5QYEPvnXTb8RBSidsnINY7akg", authDomain: "souqalghiyar.firebaseapp.com", projectId: "souqalghiyar", storageBucket: "souqalghiyar.firebasestorage.app", messagingSenderId: "186585426069", appId: "1:186585426069:web:9f34cedeee498d1bd3539c" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        let usersData = [];
        let userToDeleteId = null;

        // التعديل هنا: جلب البيانات فقط بعد التأكد من حالة تسجيل الدخول
        window.onload = function() {
            firebase.auth().onAuthStateChanged(function(user) {
                if (user) {
                    fetchUsers();
                } else {
                    window.location.href = "index.html";
                }
            });
        };

        function fetchUsers() {
            db.collection('UserEmp').onSnapshot((snapshot) => {
                usersData = [];
                snapshot.forEach((doc) => {
                    let u = doc.data();
                    u.user_id = doc.id;
                    usersData.push(u);
                });
                renderUsers();
            }, error => console.error("Error Fetching Users:", error));
        }

        function renderUsers() {
            let container = document.getElementById('usersContainer');
            let query = document.getElementById('search-input').value.toLowerCase();
            let htmlStr = '', count = 0;

            for (let i = 0; i < usersData.length; i++) {
                let u = usersData[i];
                let dispName = u.display_name || u.name || '';
                let phone = u.phone_number || u.phone || '';
                
                if (query && !dispName.toLowerCase().includes(query) && !phone.includes(query)) continue;
                count++;
                
                let isBtnAdmin = u.user_permissions === 'admin';
                let permText = isBtnAdmin ? 'مدير' : 'موظف';
                let permColor = isBtnAdmin ? 'bg-blue-100 text-blue-800 border-blue-200' : 'bg-gray-100 text-gray-800 border-gray-200';
                
                let isActive = u.status === 'active';
                let statusText = isActive ? 'الحالة: نشط' : 'الحالة: موقوف';
                let statusColor = isActive ? 'text-[#4CAF50]' : 'text-red-600';

                htmlStr += '<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 flex flex-col md:flex-row md:items-center justify-between gap-4 hover:shadow-md transition-shadow"><div class="flex-1"><div class="flex items-center gap-3 mb-2"><h3 class="text-xl font-bold text-gray-900">' + dispName + '</h3><span class="px-3 py-1 rounded-full text-xs font-bold border ' + permColor + '">' + permText + '</span></div>';
                htmlStr += '<div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-sm text-gray-600 mt-3"><div><i class="fas fa-phone w-4 text-gray-400"></i> رقم الهاتف: <span dir="ltr" class="font-bold">' + phone + '</span></div><div><i class="fas fa-lock w-4 text-gray-400"></i> كلمة المرور: <span class="font-bold">' + (u.password || '****') + '</span></div><div><i class="fas fa-envelope w-4 text-gray-400"></i> الإيميل: <span dir="ltr">' + (u.email || 'لا يوجد') + '</span></div><div class="font-bold ' + statusColor + '"><i class="fas ' + (isActive ? 'fa-check-circle' : 'fa-ban') + ' w-4"></i> ' + statusText + '</div></div></div>';
                
                htmlStr += '<div class="flex gap-2 justify-end md:justify-center"><button onclick="openUserModal(\'' + u.user_id + '\')" class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 hover:bg-blue-100 flex items-center justify-center transition-colors shadow-sm"><i class="fas fa-pen"></i></button><button onclick="attemptDelete(\'' + u.user_id + '\', \'' + dispName + '\', \'' + u.user_permissions + '\')" class="w-10 h-10 rounded-full bg-red-50 text-red-600 hover:bg-red-100 flex items-center justify-center transition-colors shadow-sm"><i class="fas fa-trash"></i></button></div></div>';
            }

            if(count === 0) htmlStr = '<div class="text-center py-20 text-gray-400"><i class="fas fa-users-slash text-6xl mb-4"></i><h3 class="text-xl font-bold">لا يوجد موظفين مطابقين للبحث</h3></div>';
            container.innerHTML = htmlStr;
            document.getElementById('total-count').innerText = count;
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden-element'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden-element'); }

        function openUserModal(id) {
            let titleEl = document.getElementById('modal-title');
            if (id) {
                titleEl.innerText = "تعديل بيانات الموظف";
                let u = usersData.find(x => x.user_id === id);
                document.getElementById('user-id').value = u.user_id;
                document.getElementById('user-name').value = u.display_name || u.name || '';
                document.getElementById('user-phone').value = u.phone_number || u.phone || '';
                document.getElementById('user-pass').value = u.password || '';
                document.getElementById('user-email').value = u.email || "";
                document.getElementById('user-fcm').value = u.fcm_token || "";
                
                document.querySelector('input[name="user-perm"][value="' + u.user_permissions + '"]').checked = true;
                document.querySelector('input[name="user-status"][value="' + u.status + '"]').checked = true;
            } else {
                titleEl.innerText = "إضافة موظف جديد";
                document.getElementById('user-id').value = ""; document.getElementById('user-name').value = "";
                document.getElementById('user-phone').value = ""; document.getElementById('user-pass').value = "";
                document.getElementById('user-email').value = ""; document.getElementById('user-fcm').value = "";
                document.querySelector('input[name="user-perm"][value="employee"]').checked = true;
                document.querySelector('input[name="user-status"][value="active"]').checked = true;
            }
            openModal('user-modal');
        }

        function saveUser() {
            let id = document.getElementById('user-id').value;
            let display_name = document.getElementById('user-name').value.trim();
            let phone_number = document.getElementById('user-phone').value.trim();
            let password = document.getElementById('user-pass').value.trim();

            if(!display_name || !phone_number || !password) return showToast("يرجى تعبئة الحقول الإجبارية", false);

            let userData = {
                display_name, phone_number, password,
                email: document.getElementById('user-email').value.trim(),
                fcm_token: document.getElementById('user-fcm').value.trim(),
                user_permissions: document.querySelector('input[name="user-perm"]:checked').value,
                status: document.querySelector('input[name="user-status"]:checked').value
            };

            if (id) {
                db.collection('UserEmp').doc(id).update(userData).then(() => { closeModal('user-modal'); showToast("تم التعديل بنجاح", true); });
            } else {
                db.collection('UserEmp').add(userData).then(() => { closeModal('user-modal'); showToast("تمت الإضافة بنجاح", true); });
            }
        }

        function attemptDelete(id, name, permissions) {
            if (permissions === 'admin') {
                let adminCount = usersData.filter(u => u.user_permissions === 'admin').length;
                if (adminCount <= 1) return showToast("لا يمكن حذف حساب المدير الوحيد.", false);
            }
            userToDeleteId = id;
            document.getElementById('delete-message').innerText = "هل أنت متأكد من رغبتك في حذف الموظف '" + name + "' نهائياً؟";
            openModal('delete-modal');
        }

        function executeDelete() {
            db.collection('UserEmp').doc(userToDeleteId).delete().then(() => {
                closeModal('delete-modal');
                showToast("تم حذف الموظف بنجاح", true);
            });
        }

        function showToast(message, isSuccess) {
            let toast = document.getElementById('toast-message'), icon = document.getElementById('toast-icon');
            document.getElementById('toast-text').innerText = message;
            toast.className = isSuccess 
                ? "fixed top-4 left-1/2 transform -translate-x-1/2 bg-[#4CAF50] text-white px-6 py-3 rounded-xl shadow-lg transition-opacity z-50 flex items-center gap-3"
                : "fixed top-4 left-1/2 transform -translate-x-1/2 bg-red-600 text-white px-6 py-3 rounded-xl shadow-lg transition-opacity z-50 flex items-center gap-3";
            icon.className = isSuccess ? "fas fa-check-circle text-xl" : "fas fa-exclamation-triangle text-xl";
            toast.classList.remove('hidden-element');
            setTimeout(() => toast.classList.add('hidden-element'), 4000);
        }
    </script>
</body>
</html>
