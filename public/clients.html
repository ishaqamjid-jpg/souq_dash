<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عملاء التطبيق | Souq app</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .hidden-element { display: none !important; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); }
        .client-details { display: none; }
        .client-details.open { display: block; }
        .fab-button { position: fixed; bottom: 2rem; left: 2rem; z-index: 40; }
    </style>
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden">

    <aside class="w-64 bg-gray-900 text-white flex flex-col shrink-0 shadow-lg z-20">
        <div class="h-16 flex items-center justify-center font-black text-2xl bg-gray-950 border-b border-gray-800">Souq app</div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="dashboard.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">الرئيسية</a>
            <a href="orders.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">إدارة الطلبات</a>
            <a href="reports.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">التقارير والإحصائيات</a>
            <a href="ads.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">إدارة الإعلانات</a>
            <a href="trader.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">إدارة التجار</a>
            <a href="clients.html" class="block px-4 py-3 bg-blue-600 shadow-md rounded-lg transition-colors font-bold">عملاء التطبيق</a>
        </nav>
        <div class="p-4 border-t border-gray-800">
            <a href="index.html" class="block text-center w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-lg transition-colors shadow">تسجيل الخروج</a>
        </div>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden relative">
        <header class="h-16 bg-[#0D1B6D] text-white shadow-sm flex items-center justify-between px-8 shrink-0 z-10">
            <h2 class="text-xl font-bold">عملاء التطبيق</h2>
            <div class="flex items-center gap-6">
                <button onclick="fetchClients()" class="text-white hover:text-gray-200 font-bold transition flex items-center gap-2">
                    <i class="fas fa-sync-alt"></i> تحديث
                </button>
                <div class="bg-white/20 px-4 py-1.5 rounded-full font-bold text-sm">الإجمالي: <span id="total-count">0</span></div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto bg-gray-50 p-6 relative">
            <div class="max-w-7xl mx-auto mb-6 relative">
                <i class="fas fa-search absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                <input type="tel" id="search-input" onkeyup="renderClients()" placeholder="ابحث برقم الهاتف..." class="w-full bg-white border border-gray-200 text-gray-900 rounded-xl shadow-sm focus:ring-[#0D1B6D] focus:border-[#0D1B6D] block pr-12 p-3.5 outline-none transition-colors text-left" dir="ltr">
                <button id="clear-search" onclick="clearSearch()" class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-red-500 hidden-element transition-colors"><i class="fas fa-times"></i></button>
            </div>
            <div id="clientsContainer" class="max-w-7xl mx-auto space-y-4 pb-24"></div>
        </main>

        <button onclick="openAddModal()" class="fab-button w-14 h-14 bg-[#0D1B6D] hover:bg-blue-900 text-white rounded-full shadow-lg flex items-center justify-center transition-transform hover:scale-105"><i class="fas fa-plus text-xl"></i></button>
    </div>

    <!-- نافذة الإضافة والتعديل -->
    <div id="add-modal" class="fixed inset-0 modal-overlay z-50 hidden-element flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto flex flex-col">
            <div class="p-6 border-b border-gray-200 flex justify-between items-center sticky top-0 bg-white z-10">
                <h3 class="text-xl font-bold text-[#0D1B6D]">إضافة عميل جديد</h3>
                <button onclick="closeModal('add-modal')" class="text-gray-400 hover:text-red-500"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">نوع العميل:</label>
                    <div class="flex gap-6 mb-2">
                        <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="add-type" value="فرد" checked onchange="toggleAddCommercialFields(false)" class="w-4 h-4 text-[#0D1B6D]"><span class="font-bold">فرد</span></label>
                        <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="add-type" value="تجاري" onchange="toggleAddCommercialFields(true)" class="w-4 h-4 text-[#0D1B6D]"><span class="font-bold">تجاري</span></label>
                    </div>
                </div>
                <div><label id="lbl-add-name" class="block text-sm font-bold text-gray-700 mb-1">اسم العميل</label><input type="text" id="add-name" class="w-full border border-gray-300 p-2.5 rounded-lg focus:outline-none focus:border-[#0D1B6D]"></div>
                <div><label class="block text-sm font-bold text-gray-700 mb-1">رقم الهاتف</label><input type="tel" id="add-phone" class="w-full border border-gray-300 p-2.5 rounded-lg focus:outline-none focus:border-[#0D1B6D] text-left" dir="ltr"></div>
                <div id="add-commercial-fields" class="hidden-element space-y-4 border-t border-gray-100 pt-4 mt-2">
                    <div><label class="block text-sm font-bold text-gray-700 mb-1">الاسم التجاري</label><input type="text" id="add-trade-name" class="w-full border border-gray-300 p-2.5 rounded-lg focus:outline-none focus:border-[#0D1B6D]"></div>
                    <div><label class="block text-sm font-bold text-gray-700 mb-1">رقم الوثيقة الحكومية</label><input type="text" id="add-trade-number" class="w-full border border-gray-300 p-2.5 rounded-lg focus:outline-none focus:border-[#0D1B6D]"></div>
                </div>
                <div class="border-t border-gray-100 pt-4 mt-2"><label class="block text-sm font-bold text-gray-700 mb-1">العنوان</label><input type="text" id="add-location" class="w-full border border-gray-300 p-2.5 rounded-lg focus:outline-none focus:border-[#0D1B6D]"></div>
                <div><label class="block text-sm font-bold text-gray-700 mb-1">الحالة</label><input type="text" id="add-status" value="active" class="w-full border border-gray-300 p-2.5 rounded-lg focus:outline-none focus:border-[#0D1B6D]" dir="ltr"></div>
            </div>
            <div class="p-6 border-t border-gray-200 bg-gray-50 flex justify-end gap-3 rounded-b-2xl sticky bottom-0">
                <button onclick="closeModal('add-modal')" class="px-6 py-2.5 text-gray-600 font-bold bg-gray-200 rounded-lg">إلغاء</button>
                <button onclick="saveNewClient()" class="px-8 py-2.5 bg-[#0D1B6D] text-white font-bold rounded-lg shadow-md hover:bg-blue-900">إضافة العميل</button>
            </div>
        </div>
    </div>

    <!-- نافذة تأكيد الحذف والتنبيه -->
    <div id="delete-modal" class="fixed inset-0 modal-overlay z-50 hidden-element flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 text-center">
            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4"><i class="fas fa-exclamation-triangle text-3xl text-red-600"></i></div>
            <h3 class="text-xl font-bold mb-2">تأكيد الحذف</h3>
            <p class="text-gray-500 mb-6" id="delete-message">هل أنت متأكد من حذف العميل؟</p>
            <div class="flex gap-3 justify-center">
                <button onclick="closeModal('delete-modal')" class="flex-1 px-4 py-2 bg-gray-100 rounded-lg font-bold">إلغاء</button>
                <button id="confirm-delete-btn" class="flex-1 px-4 py-2 bg-red-600 text-white rounded-lg font-bold">حذف</button>
            </div>
        </div>
    </div>
    
    <div id="toast-message" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-[#4CAF50] text-white px-6 py-3 rounded-xl shadow-lg hidden-element transition-opacity z-50 flex items-center gap-3"><i class="fas fa-check-circle text-xl"></i> <span id="toast-text" class="font-bold"></span></div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script> <!-- السطر المضاف -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyA-ta3tPT5QYEPvnXTb8RBSidsnINY7akg", authDomain: "souqalghiyar.firebaseapp.com", projectId: "souqalghiyar", storageBucket: "souqalghiyar.firebasestorage.app", messagingSenderId: "186585426069", appId: "1:186585426069:web:9f34cedeee498d1bd3539c" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let clientsData = [];
        let clientToDeleteId = null;

        // التحقق من المصادقة قبل الفتح
        window.onload = function() {
            firebase.auth().onAuthStateChanged(function(user) {
                if (user) {
                    fetchClients();
                } else {
                    window.location.href = "index.html";
                }
            });
        };

        function fetchClients() {
            db.collection('clients').onSnapshot((snapshot) => {
                clientsData = [];
                snapshot.forEach((doc) => {
                    let data = doc.data();
                    data.user_id = doc.id;
                    clientsData.push(data);
                });
                renderClients();
            });
        }

        function renderClients() {
            let container = document.getElementById('clientsContainer');
            let query = document.getElementById('search-input').value.toLowerCase();
            document.getElementById('clear-search').classList.toggle('hidden-element', query.length === 0);

            let htmlStr = '', count = 0;

            for (let i = 0; i < clientsData.length; i++) {
                let c = clientsData[i];
                if (query && c.phone_number && !c.phone_number.includes(query)) continue;
                count++;
                
                let titleText = (c.type === 'تجاري' && c.trade_name) ? (c.trade_name + ' (' + c.display_name + ')') : c.display_name;
                let isActive = c.status === 'active';
                let statusColor = isActive ? 'text-[#4CAF50]' : 'text-red-600';
                let statusText = isActive ? 'الحالة: نشط' : 'الحالة: غير نشط';
                let blockIcon = isActive ? 'fa-ban' : 'fa-check-circle';
                let blockColor = isActive ? 'text-red-500 hover:bg-red-100' : 'text-[#4CAF50] hover:bg-green-100';

                htmlStr += '<div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-md transition-shadow mb-4">';
                htmlStr += '<div class="p-5 cursor-pointer flex justify-between items-center" onclick="toggleDetails(\'' + c.user_id + '\')"><div class="flex-1"><h3 class="text-lg font-bold text-gray-900 mb-1">' + titleText + '</h3><div class="text-gray-600 text-sm mb-1">رقم الهاتف: <span dir="ltr" class="font-bold">' + (c.phone_number || '') + '</span></div><div class="text-gray-500 text-xs mb-2">النوع: ' + (c.type || '') + '</div>';
                
                if (c.banned_status) htmlStr += '<div class="text-red-600 font-bold text-xs bg-red-50 inline-block px-2 py-1 rounded">محظور بسبب الرفض المتكرر</div>';
                else htmlStr += '<div class="' + statusColor + ' font-bold text-sm">' + statusText + '</div>';
                htmlStr += '</div><div class="flex items-center gap-1" onclick="event.stopPropagation()"><button onclick="openDeleteModal(\'' + c.user_id + '\', \'' + c.display_name + '\')" class="w-10 h-10 rounded-full text-red-500 hover:bg-red-50 flex items-center justify-center transition-colors"><i class="fas fa-trash"></i></button><button onclick="toggleClientStatus(\'' + c.user_id + '\')" class="w-10 h-10 rounded-full ' + blockColor + ' flex items-center justify-center transition-colors"><i class="fas ' + blockIcon + '"></i></button><div class="w-10 h-10 rounded-full text-gray-400 flex items-center justify-center" onclick="toggleDetails(\'' + c.user_id + '\')"><i id="icon-' + c.user_id + '" class="fas fa-chevron-down"></i></div></div></div>';

                htmlStr += '<div id="details-' + c.user_id + '" class="client-details border-t border-gray-100 bg-gray-50 p-5">';
                let checkInd = c.type === 'فرد' ? 'checked' : '', checkCom = c.type === 'تجاري' ? 'checked' : '';
                htmlStr += '<div class="mb-4"><label class="block text-sm font-bold text-gray-700 mb-2">نوع العميل:</label><div class="flex gap-6"><label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="type-' + c.user_id + '" value="فرد" ' + checkInd + ' onchange="toggleEditCommercial(\'' + c.user_id + '\', false)" class="w-4 h-4 text-[#0D1B6D]"><span>فرد</span></label><label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="type-' + c.user_id + '" value="تجاري" ' + checkCom + ' onchange="toggleEditCommercial(\'' + c.user_id + '\', true)" class="w-4 h-4 text-[#0D1B6D]"><span>تجاري</span></label></div></div>';
                htmlStr += '<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4"><div><label class="block text-xs font-bold text-gray-600 mb-1">اسم العميل</label><input type="text" id="edit-name-' + c.user_id + '" value="' + (c.display_name || '') + '" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-[#0D1B6D]"></div><div><label class="block text-xs font-bold text-gray-600 mb-1">رقم الهاتف</label><input type="tel" id="edit-phone-' + c.user_id + '" value="' + (c.phone_number || '') + '" dir="ltr" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-[#0D1B6D] text-left"></div></div>';
                
                let commDisplay = c.type === 'تجاري' ? 'block' : 'none';
                htmlStr += '<div id="comm-fields-' + c.user_id + '" style="display:' + commDisplay + ';" class="mb-4 space-y-4 border-t border-gray-200 pt-4"><div><label class="block text-xs font-bold text-gray-600 mb-1">الاسم التجاري</label><input type="text" id="edit-trade-name-' + c.user_id + '" value="' + (c.trade_name || '') + '" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-[#0D1B6D]"></div><div><label class="block text-xs font-bold text-gray-600 mb-1">رقم السجل التجاري</label><input type="text" id="edit-trade-num-' + c.user_id + '" value="' + (c.trade_number || '') + '" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-[#0D1B6D]"></div></div>';

                htmlStr += '<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4 border-t border-gray-200 pt-4"><div><label class="block text-xs font-bold text-gray-600 mb-1">العنوان</label><input type="text" id="edit-loc-' + c.user_id + '" value="' + (c.location || '') + '" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-[#0D1B6D]"></div><div><label class="block text-xs font-bold text-gray-600 mb-1">الحالة</label><input type="text" id="edit-status-' + c.user_id + '" value="' + (c.status || '') + '" dir="ltr" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-[#0D1B6D] text-left"></div></div>';
                htmlStr += '<div class="bg-orange-50 border border-orange-200 p-4 rounded-xl mb-4"><h4 class="font-bold text-orange-800 text-xs mb-3">إعدادات الرفض:</h4><div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-end"><div><label class="block text-xs font-bold text-gray-600 mb-1">عدد مرات الرفض</label><input type="number" id="edit-rej-' + c.user_id + '" value="' + (c.number_of_rejections || 0) + '" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-orange-500"></div>';
                let checkBan = c.banned_status ? 'checked' : '';
                htmlStr += '<div class="flex items-center gap-2 bg-white p-2 border border-gray-200 rounded"><input type="checkbox" id="edit-ban-' + c.user_id + '" ' + checkBan + ' class="w-5 h-5 text-red-600 rounded cursor-pointer"><label for="edit-ban-' + c.user_id + '" class="text-sm font-bold text-gray-700 cursor-pointer">محظور تلقائياً</label></div></div></div>';
                htmlStr += '<div class="mb-4"><label class="block text-xs font-bold text-gray-600 mb-1">FCM Token</label><input type="text" id="edit-token-' + c.user_id + '" value="' + (c.fcm_token || '') + '" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-[#0D1B6D]"></div>';
                htmlStr += '<button onclick="updateClient(\'' + c.user_id + '\')" class="w-full bg-[#0D1B6D] hover:bg-blue-900 text-white font-bold py-3 rounded-lg shadow transition-colors">حفظ التعديلات</button></div></div>';
            }

            if(count === 0) htmlStr = '<div class="text-center py-20 text-gray-400"><i class="fas fa-users-slash text-6xl mb-4"></i><h3 class="text-xl font-bold">لا يوجد عملاء مطابقين</h3></div>';
            container.innerHTML = htmlStr;
            document.getElementById('total-count').innerText = count;
        }

        function clearSearch() { document.getElementById('search-input').value = ''; renderClients(); }
        function openModal(id) { document.getElementById(id).classList.remove('hidden-element'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden-element'); }

        function toggleDetails(id) {
            document.getElementById('details-' + id).classList.toggle('open');
            document.getElementById('icon-' + id).classList.toggle('fa-chevron-down');
            document.getElementById('icon-' + id).classList.toggle('fa-chevron-up');
        }

        function toggleEditCommercial(id, isCommercial) {
            document.getElementById('comm-fields-' + id).style.display = isCommercial ? 'block' : 'none';
        }

        function openAddModal() {
            document.getElementById('add-name').value = ''; document.getElementById('add-phone').value = '';
            document.getElementById('add-trade-name').value = ''; document.getElementById('add-trade-number').value = '';
            document.getElementById('add-location').value = ''; document.getElementById('add-status').value = 'active';
            document.querySelector('input[name="add-type"][value="فرد"]').checked = true;
            toggleAddCommercialFields(false);
            openModal('add-modal');
        }

        function toggleAddCommercialFields(isCommercial) {
            document.getElementById('add-commercial-fields').classList.toggle('hidden-element', !isCommercial);
            document.getElementById('lbl-add-name').innerText = isCommercial ? 'اسم المالك التجاري' : 'اسم العميل';
        }

        function saveNewClient() {
            let type = document.querySelector('input[name="add-type"]:checked').value;
            let display_name = document.getElementById('add-name').value.trim();
            let phone_number = document.getElementById('add-phone').value.trim();

            if(!display_name || !phone_number) return showToast("يرجى إدخال اسم العميل ورقم الهاتف", false);

            db.collection('clients').add({
                display_name, phone_number, type,
                trade_name: type === 'تجاري' ? document.getElementById('add-trade-name').value : "",
                trade_number: type === 'تجاري' ? document.getElementById('add-trade-number').value : "",
                location: document.getElementById('add-location').value,
                status: document.getElementById('add-status').value,
                number_of_rejections: 0, banned_status: false, fcm_token: "", commercial_document_image: "",
                created_at: new Date().toISOString().split('T')[0]
            }).then(() => { closeModal('add-modal'); showToast("تمت الإضافة بنجاح"); });
        }

        function updateClient(id) {
            let type = document.querySelector('input[name="type-' + id + '"]:checked').value;
            db.collection('clients').doc(id).update({
                type,
                display_name: document.getElementById('edit-name-' + id).value,
                phone_number: document.getElementById('edit-phone-' + id).value,
                trade_name: type === 'تجاري' ? document.getElementById('edit-trade-name-' + id).value : "",
                trade_number: type === 'تجاري' ? document.getElementById('edit-trade-num-' + id).value : "",
                location: document.getElementById('edit-loc-' + id).value,
                status: document.getElementById('edit-status-' + id).value,
                number_of_rejections: parseInt(document.getElementById('edit-rej-' + id).value) || 0,
                banned_status: document.getElementById('edit-ban-' + id).checked,
                fcm_token: document.getElementById('edit-token-' + id).value
            }).then(() => { toggleDetails(id); showToast("تم التحديث بنجاح"); });
        }

        function toggleClientStatus(id) {
            let client = clientsData.find(c => c.user_id === id);
            let newStatus = client.status === 'active' ? 'not_active' : 'active';
            db.collection('clients').doc(id).update({ status: newStatus }).then(() => showToast("تم تغيير حالة الحساب"));
        }

        function openDeleteModal(id, name) {
            clientToDeleteId = id;
            document.getElementById('delete-message').innerText = "هل أنت متأكد أنك تريد حذف العميل '" + name + "' نهائياً؟";
            openModal('delete-modal');
        }

        function executeDelete() {
            db.collection('clients').doc(clientToDeleteId).delete().then(() => { closeModal('delete-modal'); showToast("تم الحذف بنجاح"); });
        }

        function showToast(msg, isSuccess = true) {
            let toast = document.getElementById('toast-message');
            document.getElementById('toast-text').innerText = msg;
            toast.className = isSuccess ? "fixed top-4 left-1/2 transform -translate-x-1/2 bg-[#4CAF50] text-white px-6 py-3 rounded-xl shadow-lg transition-opacity z-50 flex items-center gap-3" : "fixed top-4 left-1/2 transform -translate-x-1/2 bg-red-600 text-white px-6 py-3 rounded-xl shadow-lg transition-opacity z-50 flex items-center gap-3";
            toast.classList.remove('hidden-element');
            setTimeout(() => toast.classList.add('hidden-element'), 3000);
        }
    </script>
</body>
</html>
