        <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto flex flex-col">

                    <div><label class="block text-sm font-bold text-gray-700 mb-1">الأولوية</label><input type="number" id="comm-priority" value="0" class="w-full border border-gray-300 p-2.5 rounded-lg focus:border-blue-500 outline-none"></div>

                <div><label class="block text-sm font-bold text-gray-700 mb-1">الرسالة</label><textarea id="pub-message" rows="4" class="w-full border border-gray-300 p-2.5 rounded-lg focus:border-blue-500 outline-none resize-none"></textarea></div>

    <!-- نافذة الحذف والتنبيه -->
    <div id="delete-modal" class="fixed inset-0 modal-overlay z-50 hidden-element flex items-center justify-center p-4">

            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4"><i class="fas fa-exclamation-triangle text-3xl text-red-600"></i></div>
            <h3 class="text-xl font-bold text-gray-800 mb-2">تأكيد الحذف</h3>
            <p class="text-gray-500 mb-6">هل أنت متأكد من رغبتك في حذف هذا الإعلان نهائياً؟</p>
            <div class="flex gap-3 justify-center">
                <button onclick="closeModal('delete-modal')" class="flex-1 px-4 py-2 text-gray-600 font-bold bg-gray-100 rounded-lg">إلغاء</button>
                <button id="confirm-delete-btn" onclick="executeDelete()" class="flex-1 px-4 py-2 bg-red-600 text-white font-bold rounded-lg">حذف</button>
            </div>

    <div id="toast-message" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-[#4CAF50] text-white px-6 py-3 rounded-xl shadow-lg hidden-element transition-opacity z-50 flex items-center gap-3">
        <i class="fas fa-check-circle text-xl"></i> <span id="toast-text" class="font-bold"></span>

    <!-- Firebase + Auth -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <script>
        const firebaseConfig = { apiKey: "AIzaSyA-ta3tPT5QYEPvnXTb8RBSidsnINY7akg", authDomain: "souqalghiyar.firebaseapp.com", projectId: "souqalghiyar", storageBucket: "souqalghiyar.firebasestorage.app", messagingSenderId: "186585426069", appId: "1:186585426069:web:9f34cedeee498d1bd3539c" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        let currentTab = 'commercial';
        let commercialAds = [], publicAds = [];
        let itemToDelete = { type: '', id: '' };

        // ======== دوال معالجة التواريخ لـ Firestore ======= //
        
        // 1. تنسيق التاريخ ليظهر في الجدول بشكل أنيق ومقروء
        function formatDateForDisplay(val) {
            if (!val) return 'غير محدد';
            let d;
            if (val.toDate) { d = val.toDate(); } // إذا كانت القيمة Timestamp من فايربيز
            else if (val instanceof Date) { d = val; }
            else if (typeof val === 'string') {
                // تنظيف النص في حال تم حفظه كسلسلة نصية
                let cleanStr = val.replace(' at ', ' ').replace(/UTC\S*/, '').replace(/GMT\S*/, '').trim();
                d = new Date(cleanStr);
                if (isNaN(d.getTime())) d = new Date(val); // محاولة أخيرة
            }
            if (d && !isNaN(d.getTime())) {
                return d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            }
            return val;
        }

        // 2. تنسيق التاريخ ليتوافق مع input type="datetime-local" عند فتح نافذة التعديل
        function formatDateForInput(val) {
            if (!val) return '';
            let d;
            if (val.toDate) { d = val.toDate(); }
            else if (val instanceof Date) { d = val; }
            else if (typeof val === 'string') {
                let cleanStr = val.replace(' at ', ' ').replace(/UTC\S*/, '').replace(/GMT\S*/, '').trim();
                d = new Date(cleanStr);
                if (isNaN(d.getTime())) d = new Date(val);
            }
            if (d && !isNaN(d.getTime())) {
                let pad = (n) => n < 10 ? '0' + n : n;
                // إرجاع الصيغة المطابقة: YYYY-MM-DDThh:mm
                return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
            }
            return '';
        }

        // 3. تحويل النص القادم من الحقل إلى كائن Date ليتم حفظه كـ Timestamp في فايربيز
        function parseDateForFirestore(val) {
            if (!val) return null;
            let d = new Date(val);
            return isNaN(d.getTime()) ? null : d; 
        }
        
        // =================================================== //

        window.onload = function() {
            firebase.auth().onAuthStateChanged(function(user) {
                if (user) {
                    fetchAds();
                } else {
                    window.location.href = "index.html";
                }
            });
        };

        function fetchAds() {
            // انتبه: لديك تعارض في اسم الـ collection (هنا 'advertisements' بينما عند الحفظ تستخدم 'commercial_ads')
            // تركتها كما هي في الكود الخاص بك، لكن يُفضل توحيد الاسم إن كان خطأً.
            db.collection('advertisements').onSnapshot(snap => {
                commercialAds = snap.docs.map(doc => ({ ad_id: doc.id, ...doc.data() }));
                if (currentTab === 'commercial') renderAds();
            }, error => {
                console.error("خطا در دریافت تبلیغات تجاری:", error);
            });

            db.collection('public_advertisements').onSnapshot(snap => {
                publicAds = snap.docs.map(doc => ({ doc_id: doc.id, ...doc.data() }));
                if (currentTab === 'public') renderAds();
            }, error => {
                console.error("خطا در دریافت اعلانات عمومی:", error);
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            let active = "border-[#0D1B6D] text-[#0D1B6D]", inactive = "border-transparent text-gray-500 hover:text-gray-800";
            document.getElementById('btn-tab-commercial').className = "px-8 py-4 font-bold border-b-4 transition-colors " + (tab === 'commercial' ? active : inactive);
            document.getElementById('btn-tab-public').className = "px-8 py-4 font-bold border-b-4 transition-colors " + (tab === 'public' ? active : inactive);
            document.getElementById('search-input').placeholder = tab === 'commercial' ? "بحث باسم الإعلان..." : "بحث بالعنوان...";
            document.getElementById('add-btn-text').innerText = tab === 'commercial' ? "إضافة إعلان تجاري" : "إضافة إشعار عام";
            document.getElementById('search-input').value = '';
            renderAds();
        }

        function renderAds() {
            let container = document.getElementById('adsContainer');
            let query = document.getElementById('search-input').value.toLowerCase();
            let htmlStr = '', count = 0;

            if (currentTab === 'commercial') {
                commercialAds.forEach(ad => {
                    let nameStr = ad.name || '';
                    if (query && !nameStr.toLowerCase().includes(query)) return;
                    count++;
                    let imgHtml = ad.image_url ? '<img src="' + ad.image_url + '" class="w-full h-32 object-cover rounded-t-xl">' : '<div class="w-full h-32 bg-gray-200 rounded-t-xl flex items-center justify-center text-gray-400"><i class="fas fa-image text-3xl"></i></div>';
                    let activeColor = ad.is_active ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800';
                    let activeText = ad.is_active ? 'يظهر للعملاء' : 'موقوف';
                    
                    htmlStr += '<div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-md transition-shadow">' + imgHtml;
                    htmlStr += '<div class="p-5"><div class="flex justify-between items-start mb-3"><div><h3 class="text-lg font-bold text-[#0D1B6D]">اسم الإعلان: ' + nameStr + '</h3><p class="text-gray-600 font-semibold">' + (ad.title || '') + '</p></div>';
                    htmlStr += '<div class="flex gap-2"><button onclick="openEditCommercial(\'' + ad.ad_id + '\')" class="w-8 h-8 rounded-full bg-blue-50 text-blue-600 hover:bg-blue-100"><i class="fas fa-pen text-sm"></i></button><button onclick="openDeleteModal(\'commercial\', \'' + ad.ad_id + '\')" class="w-8 h-8 rounded-full bg-red-50 text-red-600 hover:bg-red-100"><i class="fas fa-trash text-sm"></i></button></div></div>';
                    
                    // استخدام دالة العرض لتنسيق التواريخ
                    htmlStr += '<div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm mb-4"><div><span class="text-gray-500 block text-xs">يبدأ</span><span class="text-green-700 font-bold" dir="ltr">' + formatDateForDisplay(ad.start_date) + '</span></div><div><span class="text-gray-500 block text-xs">ينتهي</span><span class="text-red-600 font-bold" dir="ltr">' + formatDateForDisplay(ad.end_date) + '</span></div><div><span class="text-gray-500 block text-xs">الأولوية</span><span class="font-bold">' + (ad.priority || 0) + '</span></div><div><span class="text-gray-500 block text-xs">الرابط</span><span class="text-blue-500 truncate block" dir="ltr">' + (ad.target_url || 'لا يوجد') + '</span></div></div>';
                    
                    htmlStr += '<div class="flex justify-between items-center pt-4 border-t border-gray-100"><div class="flex items-center gap-3"><span class="font-bold text-gray-700">تفعيل:</span><input type="checkbox" ' + (ad.is_active ? 'checked' : '') + ' onchange="toggleStatus(\'' + ad.ad_id + '\', ' + ad.is_active + ')" class="w-5 h-5 text-green-600 cursor-pointer"></div><span class="px-3 py-1 rounded font-bold text-xs ' + activeColor + '">' + activeText + '</span></div></div></div>';
                });
            } else {
                publicAds.forEach(pub => {
                    let titleStr = pub.title || '';
                    if (query && !titleStr.toLowerCase().includes(query)) return;
                    count++;
                    let catText = pub.category === 'all' ? 'للجميع' : 'لمستخدم محدد (' + pub.phone_number + ')';
                    htmlStr += '<div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden p-5"><div class="flex justify-between items-start"><div class="flex-1"><h3 class="text-lg font-bold text-[#0D1B6D] mb-2">' + titleStr + '</h3><p class="text-gray-700 mb-4">' + (pub.message || '') + '</p>';
                    
                    // استخدام دالة العرض لتنسيق التواريخ
                    htmlStr += '<div class="grid grid-cols-1 md:grid-cols-3 gap-2 text-sm"><div><i class="fas fa-bullseye text-blue-400 ml-1"></i> الفئة: <span class="font-bold">' + catText + '</span></div><div><i class="fas fa-calendar-plus text-gray-400 ml-1"></i> الإنشاء: <span class="font-bold" dir="ltr">' + formatDateForDisplay(pub.create_date) + '</span></div><div><i class="fas fa-calendar-times text-red-400 ml-1"></i> الانتهاء: <span class="text-red-600 font-bold" dir="ltr">' + formatDateForDisplay(pub.end_date) + '</span></div></div></div>';
                    
                    htmlStr += '<button onclick="openDeleteModal(\'public\', \'' + pub.doc_id + '\')" class="w-10 h-10 rounded-full bg-red-50 text-red-600"><i class="fas fa-trash"></i></button></div></div>';
                });
            }

            if(count === 0) htmlStr = '<div class="text-center py-20 text-gray-400"><i class="fas fa-folder-open text-6xl mb-4"></i><h3 class="text-xl font-bold">لا توجد سجلات</h3></div>';
            document.getElementById('adsContainer').innerHTML = htmlStr;
            document.getElementById('total-count').innerText = count;
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden-element'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden-element'); }

        function openAddModal() {
            if (currentTab === 'commercial') {
                document.getElementById('commercial-modal-title').innerText = "إضافة إعلان تجاري";
                document.getElementById('comm-id').value = ""; document.getElementById('comm-name').value = "";
                document.getElementById('comm-title').value = ""; document.getElementById('comm-image').value = "";
                document.getElementById('comm-start').value = ""; document.getElementById('comm-end').value = "";
                document.getElementById('comm-action').value = "open_url"; document.getElementById('comm-priority').value = "0";
                document.getElementById('comm-url').value = ""; document.getElementById('comm-active').checked = true;
                openModal('commercial-modal');
            } else {
                document.getElementById('pub-title').value = ""; document.getElementById('pub-message').value = "";
                document.getElementById('pub-end').value = ""; document.getElementById('pub-phone').value = "";
                document.querySelector('input[name="pub-category"][value="all"]').checked = true;
                document.getElementById('pub-phone-container').classList.add('hidden-element');
                openModal('public-modal');
            }
        }

        function openEditCommercial(id) {
            let ad = commercialAds.find(x => x.ad_id === id);
            if(!ad) return;
            document.getElementById('commercial-modal-title').innerText = "تعديل الإعلان";
            document.getElementById('comm-id').value = ad.ad_id; document.getElementById('comm-name').value = ad.name;
            document.getElementById('comm-title').value = ad.title; document.getElementById('comm-image').value = ad.image_url || "";
            
            // استخدام دالة المعالجة لكي يظهر التاريخ بشكل صحيح داخل الـ Input
            document.getElementById('comm-start').value = formatDateForInput(ad.start_date); 
            document.getElementById('comm-end').value = formatDateForInput(ad.end_date);
            
            document.getElementById('comm-action').value = ad.click_action_type; document.getElementById('comm-priority').value = ad.priority;
            document.getElementById('comm-url').value = ad.target_url; document.getElementById('comm-active').checked = ad.is_active;
            openModal('commercial-modal');
        }

        function saveCommercialAd() {
            let id = document.getElementById('comm-id').value;
            let data = {
                name: document.getElementById('comm-name').value, 
                title: document.getElementById('comm-title').value,
                image_url: document.getElementById('comm-image').value, 
                
                // تحويل المدخل إلى Date ليُحفظ كـ Timestamp
                start_date: parseDateForFirestore(document.getElementById('comm-start').value),
                end_date: parseDateForFirestore(document.getElementById('comm-end').value), 
                
                click_action_type: document.getElementById('comm-action').value,
                priority: parseInt(document.getElementById('comm-priority').value) || 0, target_url: document.getElementById('comm-url').value,
                is_active: document.getElementById('comm-active').checked
            };
            
            // انتبه: استخدمت 'commercial_ads' بناءً على كودك السابق
            if(id) db.collection('commercial_ads').doc(id).update(data).then(() => { closeModal('commercial-modal'); showToast("تم التعديل"); });
            else db.collection('commercial_ads').add(data).then(() => { closeModal('commercial-modal'); showToast("تم الحفظ"); });
        }

        function savePublicAd() {
            let category = document.querySelector('input[name="pub-category"]:checked').value;
            let data = {
                title: document.getElementById('pub-title').value, 
                message: document.getElementById('pub-message').value,
                category: category, 
                phone_number: category === 'specific' ? document.getElementById('pub-phone').value : "",
                
                // تحويل المدخل إلى Date ليُحفظ كـ Timestamp
                end_date: parseDateForFirestore(document.getElementById('pub-end').value), 
                create_date: new Date() // نحفظه ككائن Date بدلاً من String لكي يتم التعامل معه كـ Timestamp
            };
            db.collection('public_ads').add(data).then(() => { closeModal('public-modal'); showToast("تم إرسال الإشعار"); });
        }

        function toggleStatus(id, currentStatus) {
            db.collection('commercial_ads').doc(id).update({ is_active: !currentStatus }).then(() => showToast("تم تغيير حالة الإعلان"));
        }

        function openDeleteModal(type, id) {
            itemToDelete = { type, id };
            openModal('delete-modal');
        }

        function executeDelete() {
            let col = itemToDelete.type === 'commercial' ? 'commercial_ads' : 'public_ads';
            db.collection(col).doc(itemToDelete.id).delete().then(() => { closeModal('delete-modal'); showToast("تم الحذف بنجاح"); });
        }

        function showToast(msg) {
            let toast = document.getElementById('toast-message');
            document.getElementById('toast-text').innerText = msg;
            toast.classList.remove('hidden-element');
            setTimeout(() => toast.classList.add('hidden-element'), 3000);
        }
    </script>
</body>
</html>
