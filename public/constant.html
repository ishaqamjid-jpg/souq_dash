<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الثوابت | Souq app</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .hidden-element { display: none !important; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); }
        .fab-button { position: fixed; bottom: 2rem; left: 2rem; z-index: 40; }
    </style>
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden">

    <aside class="w-64 bg-gray-900 text-white flex flex-col shrink-0 shadow-lg z-20">
        <div class="h-16 flex items-center justify-center font-black text-2xl bg-gray-950 border-b border-gray-800">Souq app</div>
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <a href="dashboard.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">الرئيسية</a>
            <a href="orders.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">إدارة الطلبات</a>
            <a href="reports.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">التقارير والإحصائيات</a>
            <a href="ads.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">إدارة الإعلانات</a>
            <a href="trader.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">إدارة التجار</a>
            <a href="clients.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">عملاء التطبيق</a>
            <a href="constant.html" class="block px-4 py-3 bg-blue-600 shadow-md rounded-lg transition-colors font-bold">إدارة الثوابت</a>
        </nav>
        <div class="p-4 border-t border-gray-800">
            <a href="index.html" class="block w-full text-center bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-lg transition-colors shadow">تسجيل الخروج</a>
        </div>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden relative">
        <header class="h-16 bg-[#0D1B6D] text-white shadow-sm flex items-center justify-between px-8 shrink-0 z-10">
            <h2 class="text-xl font-bold">إدارة الثوابت (القوائم المنسدلة)</h2>
            <div class="flex items-center gap-6">
                <div class="bg-white/20 px-4 py-1.5 rounded-full font-bold text-sm">العناصر: <span id="total-count">0</span></div>
            </div>
        </header>

        <div class="flex bg-white px-4 border-b border-gray-200 sticky top-0 z-10 shadow-sm overflow-x-auto" id="tabsContainer">
            <!-- تم تعديل اسم التاب و الـ ID ليناسب spare_parts_categories -->
            <button id="btn-tab-spare_parts_categories" onclick="switchTab('spare_parts_categories')" class="px-6 py-4 font-bold border-b-4 border-[#0D1B6D] text-[#0D1B6D] transition-colors whitespace-nowrap">أسماء قطع الغيار</button>
            <button id="btn-tab-brand" onclick="switchTab('brand')" class="px-6 py-4 font-bold border-b-4 border-transparent text-gray-500 hover:text-gray-800 transition-colors whitespace-nowrap">الماركات</button>
            <button id="btn-tab-quality" onclick="switchTab('quality')" class="px-6 py-4 font-bold border-b-4 border-transparent text-gray-500 hover:text-gray-800 transition-colors whitespace-nowrap">أنواع الجودة</button>
            <button id="btn-tab-location" onclick="switchTab('location')" class="px-6 py-4 font-bold border-b-4 border-transparent text-gray-500 hover:text-gray-800 transition-colors whitespace-nowrap">المحافظات</button>
        </div>

        <main class="flex-1 overflow-y-auto bg-gray-50 p-6 relative">
            <div id="listContainer" class="max-w-4xl mx-auto space-y-4 pb-24"></div>
        </main>

        <button onclick="openFormModal()" class="fab-button w-14 h-14 bg-[#4CAF50] hover:bg-green-600 text-white rounded-full shadow-lg flex items-center justify-center transition-transform hover:scale-105"><i class="fas fa-plus text-xl"></i></button>
    </div>

    <!-- نافذة إضافة / تعديل وتأكيد الحذف -->
    <div id="form-modal" class="fixed inset-0 modal-overlay z-50 hidden-element flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md max-h-[90vh] flex flex-col">
            <div class="p-6 border-b border-gray-200 flex justify-between items-center bg-white rounded-t-2xl">
                <h3 id="modal-title" class="text-xl font-bold text-[#0D1B6D]">إضافة جديدة</h3>
                <button onclick="closeModal('form-modal')" class="text-gray-400 hover:text-red-500 transition-colors"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="item-id">
                <div><label id="lbl-name" class="block text-sm font-bold text-gray-700 mb-2">الاسم</label><input type="text" id="item-name" class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:border-[#0D1B6D]"></div>
                <div id="spec-container" class="hidden-element"><label class="block text-sm font-bold text-gray-700 mb-2">مكان التصنيع (اختياري)</label><input type="text" id="item-spec" placeholder="مثال: اليابان مواصفات خليجي" class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:border-[#0D1B6D]"></div>
            </div>
            <div class="p-6 border-t border-gray-200 bg-gray-50 flex justify-end gap-3 rounded-b-2xl">
                <button onclick="closeModal('form-modal')" class="px-6 py-2.5 text-gray-600 font-bold hover:bg-gray-200 rounded-lg transition-colors">إلغاء</button>
                <button onclick="saveData()" class="px-8 py-2.5 bg-[#4CAF50] text-white font-bold rounded-lg shadow-md hover:bg-green-600 transition-colors">حفظ</button>
            </div>
        </div>
    </div>

    <div id="delete-modal" class="fixed inset-0 modal-overlay z-50 hidden-element flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 text-center">
            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4"><i class="fas fa-exclamation-triangle text-3xl text-red-600"></i></div>
            <h3 class="text-xl font-bold text-gray-800 mb-2">تأكيد الحذف</h3>
            <p class="text-gray-500 mb-6">هل أنت متأكد من رغبتك في حذف هذا العنصر نهائياً؟</p>
            <div class="flex gap-3 justify-center">
                <button onclick="closeModal('delete-modal')" class="flex-1 px-4 py-2 text-gray-600 font-bold bg-gray-100 rounded-lg">إلغاء</button>
                <button id="confirm-delete-btn" class="flex-1 px-4 py-2 bg-red-600 text-white font-bold rounded-lg">حذف</button>
            </div>
        </div>
    </div>

    <div id="toast-message" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-[#4CAF50] text-white px-6 py-3 rounded-xl shadow-lg hidden-element transition-opacity z-50 flex items-center gap-3">
        <i class="fas fa-check-circle text-xl"></i> <span id="toast-text" class="font-bold">تم الحفظ بنجاح</span>
    </div>

    <!-- استدعاء الفايربيس والمصادقة -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyA-ta3tPT5QYEPvnXTb8RBSidsnINY7akg", 
            authDomain: "souqalghiyar.firebaseapp.com", 
            projectId: "souqalghiyar", 
            storageBucket: "souqalghiyar.firebasestorage.app", 
            messagingSenderId: "186585426069", 
            appId: "1:186585426069:web:9f34cedeee498d1bd3539c" 
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        let currentTab = 'spare_parts_categories', deleteTargetId = null;
        let sparePartsCategories = [], brands = [], qualities = [], locations = [];

        window.onload = function() {
            firebase.auth().onAuthStateChanged(function(user) {
                if (user) {
                    fetchConstants();
                    switchTab('spare_parts_categories');
                } else {
                    window.location.href = "index.html";
                }
            });
        };

        function fetchConstants() {
            db.collection('spare_parts_categories').onSnapshot(snap => { sparePartsCategories = snap.docs.map(d => ({id: d.id, ...d.data()})); if(currentTab==='spare_parts_categories') renderData(); });
            db.collection('brands').onSnapshot(snap => { brands = snap.docs.map(d => ({id: d.id, ...d.data()})); if(currentTab==='brand') renderData(); });
            db.collection('qualities').onSnapshot(snap => { qualities = snap.docs.map(d => ({id: d.id, ...d.data()})); if(currentTab==='quality') renderData(); });
            db.collection('locations').onSnapshot(snap => { locations = snap.docs.map(d => ({id: d.id, ...d.data()})); if(currentTab==='location') renderData(); });
        }

        function switchTab(tab) {
            currentTab = tab;
            let tabsList = ['spare_parts_categories', 'brand', 'quality', 'location'];
            for(let i=0; i<tabsList.length; i++) {
                document.getElementById('btn-tab-' + tabsList[i]).className = tabsList[i] === tab 
                    ? "px-6 py-4 font-bold border-b-4 transition-colors whitespace-nowrap border-[#0D1B6D] text-[#0D1B6D]"
                    : "px-6 py-4 font-bold border-b-4 transition-colors whitespace-nowrap border-transparent text-gray-500 hover:text-gray-800";
            }
            renderData();
        }

        function getActiveArray() {
            return currentTab === 'spare_parts_categories' ? sparePartsCategories : currentTab === 'brand' ? brands : currentTab === 'quality' ? qualities : locations;
        }

        function renderData() {
            let dataArray = getActiveArray();
            let emptyMsg = currentTab === 'spare_parts_categories' ? "لا توجد أسماء قطع غيار" : currentTab === 'brand' ? "لا توجد ماركات" : currentTab === 'quality' ? "لا توجد أنواع جودة" : "لا توجد محافظات";
            let htmlStr = '';

            if (dataArray.length === 0) {
                htmlStr = '<div class="text-center py-20 text-gray-400"><i class="fas fa-folder-open text-6xl mb-4"></i><h3 class="text-xl font-bold">' + emptyMsg + '</h3></div>';
            } else {
                for (let i = 0; i < dataArray.length; i++) {
                    let item = dataArray[i];
                    // عرض الاسم بناءً على نوع الجدول (لجدول أسماء القطع نقرأ حقل spare_parts_categories)
                    let displayTitle = currentTab === 'spare_parts_categories' ? (item.spare_parts_categories || '') : (item.name || '');
                    
                    htmlStr += '<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 flex justify-between items-center hover:shadow-md transition-shadow"><div class="flex-1"><h3 class="text-lg font-bold text-[#0D1B6D]">' + displayTitle + '</h3>';
                    if(currentTab === 'brand' && item.spec) htmlStr += '<div class="text-gray-500 text-sm mt-1">مكان التصنيع: ' + item.spec + '</div>';
                    htmlStr += '</div><div class="flex gap-2"><button onclick="openFormModal(\'' + item.id + '\')" class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center"><i class="fas fa-pen"></i></button><button onclick="openDeleteModal(\'' + item.id + '\')" class="w-10 h-10 rounded-full bg-red-50 text-red-600 flex items-center justify-center"><i class="fas fa-trash"></i></button></div></div>';
                }
            }
            document.getElementById('listContainer').innerHTML = htmlStr;
            document.getElementById('total-count').innerText = dataArray.length;
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden-element'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden-element'); }

        function openFormModal(id) {
            let specContainer = document.getElementById('spec-container');
            specContainer.classList.toggle('hidden-element', currentTab !== 'brand');

            if (id) {
                document.getElementById('modal-title').innerText = "تعديل البيانات";
                let item = getActiveArray().find(x => x.id === id);
                document.getElementById('item-id').value = item.id;
                // تعبئة حقل الإدخال بالاسم المناسب للجدول الحالي
                document.getElementById('item-name').value = currentTab === 'spare_parts_categories' ? (item.spare_parts_categories || "") : (item.name || "");
                document.getElementById('item-spec').value = item.spec || "";
            } else {
                document.getElementById('modal-title').innerText = "إضافة جديدة";
                document.getElementById('item-id').value = "";
                document.getElementById('item-name').value = "";
                document.getElementById('item-spec').value = "";
            }
            openModal('form-modal');
        }

        function getActiveCollectionName() {
            return currentTab === 'spare_parts_categories' ? 'spare_parts_categories' : currentTab === 'brand' ? 'brands' : currentTab === 'quality' ? 'qualities' : 'locations';
        }

        function saveData() {
            let id = document.getElementById('item-id').value;
            let nameValue = document.getElementById('item-name').value.trim();
            if(!nameValue) return alert("يرجى إدخال الاسم");

            // تخصيص المفتاح بناءً على متطلبات الجدول (إنشاء حقل spare_parts_categories)
            let dataObj = {};
            if (currentTab === 'spare_parts_categories') {
                dataObj = { spare_parts_categories: nameValue };
            } else {
                dataObj = { name: nameValue };
            }
            
            if(currentTab === 'brand') dataObj.spec = document.getElementById('item-spec').value.trim();

            let colName = getActiveCollectionName();
            if (id) {
                db.collection(colName).doc(id).update(dataObj).then(() => { 
                    closeModal('form-modal'); 
                    showToast("تم التعديل"); 
                }).catch(err => {
                    alert("حدث خطأ أثناء التعديل");
                });
            } else {
                db.collection(colName).add(dataObj).then(() => { 
                    closeModal('form-modal'); 
                    showToast("تم الحفظ بنجاح"); 
                }).catch(err => {
                    alert("حدث خطأ أثناء الإضافة");
                });
            }
        }

        function openDeleteModal(id) {
            deleteTargetId = id;
            document.getElementById('confirm-delete-btn').onclick = executeDelete;
            openModal('delete-modal');
        }

        function executeDelete() {
            db.collection(getActiveCollectionName()).doc(deleteTargetId).delete().then(() => {
                closeModal('delete-modal'); 
                showToast("تم الحذف بنجاح");
            }).catch(err => {
                alert("حدث خطأ أثناء الحذف");
            });
        }

        function showToast(msg) {
            let toast = document.getElementById('toast-message');
            document.getElementById('toast-text').innerText = msg;
            toast.classList.remove('hidden-element');
            setTimeout(() => toast.classList.add('hidden-element'), 3000);
        }
    </script>
</body>
</html>
