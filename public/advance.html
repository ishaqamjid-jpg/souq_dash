<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة متقدمة | Souq app</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .hidden-element { display: none !important; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); }
        .alarm-details { display: none; }
        .alarm-details.open { display: block; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    </style>
</head>
<body class="bg-[#121212] flex h-screen overflow-hidden text-white">

    <aside class="w-64 bg-gray-900 flex flex-col shrink-0 shadow-xl z-20">
        <div class="h-16 flex items-center justify-center font-black text-2xl bg-gray-950 border-b border-gray-800">
            Souq app
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto custom-scrollbar text-white">
            <a href="dashboard.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg">الرئيسية</a>
            <a href="setting.html" class="block px-4 py-3 bg-[#1E1E1E] border border-gray-700 rounded-lg font-bold text-[#E91E63]"><i class="fas fa-arrow-right ml-2 text-sm"></i> رجوع للإعدادات</a>
        </nav>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden relative">
        <header class="h-16 bg-[#1E1E1E] shadow-md flex items-center justify-between px-8 shrink-0 z-10 border-b border-gray-800">
            <h2 class="text-xl font-bold">إدارة متقدمة للبيانات</h2>
        </header>

        <div class="flex bg-[#1E1E1E] px-4 border-b border-gray-800 sticky top-0 z-10 shadow-sm" id="tabsContainer">
            <button id="btn-tab-orders" onclick="switchTab('orders')" class="px-8 py-4 font-bold border-b-4 border-[#E91E63] text-[#E91E63] transition-colors">إدارة الطلبات الجذري</button>
            <button id="btn-tab-alarms" onclick="switchTab('alarms')" class="px-8 py-4 font-bold border-b-4 border-transparent text-gray-500 hover:text-white transition-colors">إدارة الإشعارات</button>
        </div>

        <main class="flex-1 overflow-y-auto p-6 relative">
            
            <!-- التبويب الأول: الطلبات المتقدمة -->
            <div id="tab-orders" class="max-w-5xl mx-auto">
                <div class="flex gap-4 mb-6">
                    <div class="relative flex-1">
                        <i class="fas fa-hashtag absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="number" id="search-order-input" placeholder="أدخل رقم الطلب للبحث المباشر في Firestore..." class="w-full bg-[#1E1E1E] border border-gray-700 text-white rounded-xl focus:border-[#E91E63] p-4 outline-none text-left" dir="ltr">
                    </div>
                    <button onclick="searchOrder()" class="bg-[#E91E63] hover:bg-pink-600 text-white font-bold px-8 rounded-xl shadow-lg transition-colors">بحث <i class="fas fa-search ml-2"></i></button>
                </div>
                <div id="order-result-container">
                    <div class="text-center py-20 text-gray-600"><i class="fas fa-search text-5xl mb-4 opacity-50"></i><p>ابحث برقم الطلب للبدء</p></div>
                </div>
            </div>

            <!-- التبويب الثاني: الإشعارات -->
            <div id="tab-alarms" class="max-w-5xl mx-auto hidden-element">
                <div class="bg-[#1E1E1E] p-4 rounded-xl border border-gray-800 mb-6 flex justify-around">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="alarm-type" value="user" checked class="w-5 h-5 accent-[#E91E63]">
                        <span class="font-bold">إشعارات العملاء</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="alarm-type" value="admin" class="w-5 h-5 accent-[#E91E63]">
                        <span class="font-bold">إشعارات الإدارة</span>
                    </label>
                </div>
                <button onclick="fetchAlarms()" class="w-full bg-[#E91E63] hover:bg-pink-600 text-white font-bold py-4 rounded-xl shadow-lg transition-colors mb-6 text-lg">جلب الإشعارات</button>
                <div id="alarms-container" class="space-y-4"></div>
            </div>

        </main>
    </div>

    <!-- نافذة تأكيد الحذف (شاملة للطلبات والإشعارات) -->
    <div id="delete-modal" class="fixed inset-0 modal-overlay z-50 hidden-element flex items-center justify-center p-4">
        <div class="bg-[#1E1E1E] text-white rounded-2xl shadow-2xl w-full max-w-sm p-6 text-center border border-gray-700">
            <div class="w-16 h-16 bg-red-900/30 rounded-full flex items-center justify-center mx-auto mb-4 text-red-500">
                <i class="fas fa-trash-alt text-3xl"></i>
            </div>
            <h3 class="text-xl font-bold mb-2">تأكيد الحذف الجذري</h3>
            <p class="text-gray-400 mb-6">تنبيه: سيتم حذف البيانات من قاعدة البيانات نهائياً.</p>
            <div class="flex gap-3 justify-center">
                <button onclick="closeModal('delete-modal')" class="flex-1 px-4 py-3 text-gray-300 font-bold bg-gray-800 hover:bg-gray-700 rounded-lg transition-colors">إلغاء</button>
                <button id="confirm-delete-btn" class="flex-1 px-4 py-3 bg-red-600 text-white font-bold hover:bg-red-700 rounded-lg transition-colors">حذف نهائي</button>
            </div>
        </div>
    </div>

    <div id="toast-message" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-[#4CAF50] text-white px-6 py-3 rounded-xl shadow-lg hidden-element transition-opacity z-50 flex items-center gap-3">
        <i class="fas fa-check-circle text-xl"></i> <span id="toast-text" class="font-bold"></span>
    </div>

    <!-- Firebase + Auth -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script> <!-- السطر المضاف -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyA-ta3tPT5QYEPvnXTb8RBSidsnINY7akg", authDomain: "souqalghiyar.firebaseapp.com", projectId: "souqalghiyar", storageBucket: "souqalghiyar.firebasestorage.app", messagingSenderId: "186585426069", appId: "1:186585426069:web:9f34cedeee498d1bd3539c" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        let currentOrder = null;
        let alarmsData = [];
        let deleteTarget = { type: '', id: '' };

        // التأكد من المصادقة عند تحميل الصفحة
        window.onload = function() {
            firebase.auth().onAuthStateChanged(function(user) {
                if (!user) {
                    window.location.href = "index.html";
                }
            });
        };

        function switchTab(tab) {
            let active = "border-[#E91E63] text-[#E91E63]", inactive = "border-transparent text-gray-500 hover:text-white";
            document.getElementById('tab-orders').classList.toggle('hidden-element', tab !== 'orders');
            document.getElementById('tab-alarms').classList.toggle('hidden-element', tab !== 'alarms');
            document.getElementById('btn-tab-orders').className = "px-8 py-4 font-bold border-b-4 transition-colors " + (tab === 'orders' ? active : inactive);
            document.getElementById('btn-tab-alarms').className = "px-8 py-4 font-bold border-b-4 transition-colors " + (tab === 'alarms' ? active : inactive);
        }

        function searchOrder() {
            let numStr = document.getElementById('search-order-input').value;
            if(!numStr) return showToast("أدخل رقم الطلب للبحث");
            let container = document.getElementById('order-result-container');
            container.innerHTML = '<div class="text-center py-20 text-gray-400"><i class="fas fa-spinner fa-spin text-5xl mb-4"></i><p>جاري البحث في قاعدة البيانات...</p></div>';

            db.collection('orders').where('order_number', '==', Number(numStr)).get().then((snapshot) => {
                if(snapshot.empty) {
                    container.innerHTML = '<div class="text-center py-20 text-red-500"><i class="fas fa-exclamation-circle text-5xl mb-4 opacity-50"></i><p>لا يوجد طلب بهذا الرقم</p></div>';
                    currentOrder = null;
                    return;
                }
                
                currentOrder = snapshot.docs[0].data();
                currentOrder.id = snapshot.docs[0].id;
                renderOrderForm(currentOrder, container);
            }).catch((err) => {
                container.innerHTML = '<div class="text-center text-red-500">حدث خطأ أثناء البحث</div>';
                console.error(err);
            });
        }

        function renderOrderForm(o, container) {
            let tClass = "w-full bg-[#121212] border border-gray-700 text-white p-3 rounded-lg focus:border-[#E91E63] outline-none";
            let htmlStr = '<div class="bg-[#1E1E1E] rounded-xl p-6 border border-gray-800 mb-6"><h3 class="text-white font-bold text-lg mb-4 border-b border-gray-700 pb-2">البيانات الأساسية:</h3>';
            htmlStr += '<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4"><div><label class="block text-gray-500 text-xs mb-1">معرف الطلب (Firestore ID)</label><input type="text" value="' + o.id + '" readonly class="w-full bg-[#121212] border border-gray-700 text-gray-500 p-3 rounded-lg"></div>';
            htmlStr += '<div><label class="block text-gray-500 text-xs mb-1">رقم الطلب (Number)</label><input type="text" value="' + (o.order_number||'') + '" readonly class="w-full bg-[#121212] border border-gray-700 text-gray-500 p-3 rounded-lg"></div></div>';
            
            htmlStr += '<div class="grid grid-cols-1 md:grid-cols-3 gap-4">';
            htmlStr += '<div><label class="text-gray-400 text-xs mb-1">الماركة</label><input type="text" id="adv-brand" value="' + (o.brand_name||'') + '" class="' + tClass + '"></div>';
            htmlStr += '<div><label class="text-gray-400 text-xs mb-1">المركبة</label><input type="text" id="adv-vehicle" value="' + (o.vehicle_name||'') + '" class="' + tClass + '"></div>';
            htmlStr += '<div><label class="text-gray-400 text-xs mb-1">الموديل</label><input type="text" id="adv-model" value="' + (o.vehicle_model||'') + '" class="' + tClass + '"></div>';
            htmlStr += '<div><label class="text-gray-400 text-xs mb-1">رقم القاعدة (VIN)</label><input type="text" id="adv-vin" value="' + (o.vin_number||'') + '" class="' + tClass + '"></div>';
            htmlStr += '<div><label class="text-gray-400 text-xs mb-1">حالة الطلب</label><input type="text" id="adv-status" value="' + (o.order_status||'') + '" class="' + tClass + '" dir="ltr"></div>';
            htmlStr += '<div><label class="text-gray-400 text-xs mb-1">رسوم التوصيل</label><input type="number" id="adv-fees" value="' + (o.delivery_fees||0) + '" class="' + tClass + '"></div></div></div>';

            let items = o.items || [];
            htmlStr += '<h3 class="text-white font-bold text-lg mb-4">القطع المطلوبة (' + items.length + ' قطع):</h3>';
            items.forEach((itm, i) => {
                htmlStr += '<div class="bg-[#2C2C2C] rounded-xl p-5 mb-4 border border-gray-700"><div class="text-[#E91E63] font-bold mb-3">قطعة ' + (i+1) + '</div>';
                htmlStr += '<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4"><div><label class="text-gray-400 text-xs">اسم القطعة</label><input type="text" id="itm-name-' + i + '" value="' + (itm.part_name||'') + '" class="' + tClass + '"></div>';
                htmlStr += '<div><label class="text-gray-400 text-xs">الكمية</label><input type="number" id="itm-qty-' + i + '" value="' + (itm.quantity||1) + '" class="' + tClass + '"></div>';
                htmlStr += '<div><label class="text-gray-400 text-xs">سعر البيع</label><input type="number" id="itm-sell-' + i + '" value="' + (itm.selling_price||0) + '" class="' + tClass + '"></div></div></div>';
            });

            htmlStr += '<div class="flex justify-between items-center mt-6 p-4 bg-[#1E1E1E] rounded-xl border border-gray-800">';
            htmlStr += '<button onclick="openDeleteModal(\'order\', \'' + o.id + '\')" class="px-6 py-3 bg-red-900/30 text-red-500 hover:bg-red-600 hover:text-white font-bold rounded-lg transition-colors flex items-center gap-2"><i class="fas fa-trash"></i> حذف جذري</button>';
            htmlStr += '<button onclick="saveOrderEdits()" class="px-10 py-3 bg-[#4CAF50] text-white font-bold rounded-lg shadow-lg hover:bg-green-600 transition-colors">حفظ التعديلات في السيرفر</button></div>';

            container.innerHTML = htmlStr;
        }

        function saveOrderEdits() {
            if(!currentOrder) return;
            
            currentOrder.brand_name = document.getElementById('adv-brand').value;
            currentOrder.vehicle_name = document.getElementById('adv-vehicle').value;
            currentOrder.vehicle_model = document.getElementById('adv-model').value;
            currentOrder.vin_number = document.getElementById('adv-vin').value;
            currentOrder.order_status = document.getElementById('adv-status').value;
            currentOrder.delivery_fees = parseFloat(document.getElementById('adv-fees').value) || 0;

            let items = currentOrder.items || [];
            items.forEach((itm, i) => {
                itm.part_name = document.getElementById('itm-name-' + i).value;
                itm.quantity = parseInt(document.getElementById('itm-qty-' + i).value) || 1;
                itm.selling_price = parseFloat(document.getElementById('itm-sell-' + i).value) || 0;
            });
            currentOrder.items = items;

            let docId = currentOrder.id;
            let dataToSave = { ...currentOrder };
            delete dataToSave.id;

            db.collection('orders').doc(docId).update(dataToSave).then(() => {
                showToast("تم الحفظ وتحديث الطلب في قاعدة البيانات");
            }).catch(err => console.error(err));
        }

        function fetchAlarms() {
            let type = document.querySelector('input[name="alarm-type"]:checked').value;
            let collectionName = type === 'user' ? 'user_alarms' : 'admin_alarms';

            db.collection(collectionName).limit(50).get().then(snap => {
                alarmsData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderAlarms(collectionName);
            });
        }

        function renderAlarms(collectionName) {
            let container = document.getElementById('alarms-container');
            let htmlStr = '';
            alarmsData.forEach(a => {
                let bgActive = a.isRead ? 'border-gray-700 text-gray-400' : 'border-[#E91E63] text-white';
                let tClass = "w-full bg-[#121212] border border-gray-700 text-white p-3 rounded-lg focus:border-[#E91E63] outline-none mt-1";
                htmlStr += '<div class="bg-[#1E1E1E] rounded-xl border ' + bgActive + ' overflow-hidden mb-4">';
                htmlStr += '<div class="p-5 cursor-pointer flex justify-between items-center bg-black/20 hover:bg-black/40" onclick="toggleDetails(\'' + a.id + '\')"><div><div class="font-bold text-lg">' + (a.title||'بدون عنوان') + '</div><div class="text-sm opacity-70">مقروء: ' + (a.isRead ? 'نعم' : 'لا') + '</div></div><i id="icon-' + a.id + '" class="fas fa-chevron-down text-gray-500"></i></div>';
                htmlStr += '<div id="details-' + a.id + '" class="alarm-details p-5 border-t border-gray-700">';
                htmlStr += '<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4"><div><label class="text-xs text-gray-400">العنوان</label><input type="text" id="al-title-' + a.id + '" value="' + (a.title||'') + '" class="' + tClass + '"></div>';
                htmlStr += '<div><label class="text-xs text-gray-400">الرسالة</label><input type="text" id="al-msg-' + a.id + '" value="' + (a.message||'') + '" class="' + tClass + '"></div></div>';
                htmlStr += '<div class="flex justify-between items-center mt-4"><button onclick="openDeleteModal(\'' + collectionName + '\', \'' + a.id + '\')" class="px-4 py-2 bg-red-900/30 text-red-500 rounded"><i class="fas fa-trash"></i> حذف</button>';
                htmlStr += '<button onclick="saveAlarmEdits(\'' + collectionName + '\', \'' + a.id + '\')" class="px-6 py-2 bg-[#2196F3] text-white font-bold rounded shadow">حفظ التعديل</button></div></div></div>';
            });
            if(alarmsData.length===0) htmlStr = '<div class="text-center text-gray-500 py-10">لا توجد إشعارات مسجلة</div>';
            container.innerHTML = htmlStr;
        }

        function toggleDetails(id) {
            let details = document.getElementById('details-' + id), icon = document.getElementById('icon-' + id);
            if(details.classList.contains('open')) { details.classList.remove('open'); icon.classList.replace('fa-chevron-up', 'fa-chevron-down'); } 
            else { details.classList.add('open'); icon.classList.replace('fa-chevron-down', 'fa-chevron-up'); }
        }

        function saveAlarmEdits(col, id) {
            let title = document.getElementById('al-title-' + id).value;
            let message = document.getElementById('al-msg-' + id).value;
            db.collection(col).doc(id).update({ title, message }).then(() => showToast("تم تحديث الإشعار"));
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden-element'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden-element'); }

        function openDeleteModal(type, id) {
            deleteTarget = { type, id };
            openModal('delete-modal');
        }

        document.getElementById('confirm-delete-btn').onclick = function() {
            closeModal('delete-modal');
            let col = deleteTarget.type === 'order' ? 'orders' : deleteTarget.type;
            
            db.collection(col).doc(deleteTarget.id).delete().then(() => {
                showToast("تم الحذف من قاعدة البيانات نهائياً");
                if (col === 'orders') {
                    document.getElementById('order-result-container').innerHTML = '<div class="text-center py-20 text-green-500"><i class="fas fa-check-circle text-5xl mb-4"></i><p>تم الحذف بنجاح</p></div>';
                    document.getElementById('search-order-input').value = "";
                } else fetchAlarms();
            });
        };

        function showToast(message) {
            let toast = document.getElementById('toast-message');
            document.getElementById('toast-text').innerText = message;
            toast.classList.remove('hidden-element');
            setTimeout(() => toast.classList.add('hidden-element'), 3000);
        }
    </script>
</body>
</html>
