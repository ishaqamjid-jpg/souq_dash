<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الحسابات والسندات | Souq app</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .hidden-element { display: none !important; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); }
        .fab-button { position: fixed; bottom: 2rem; left: 2rem; z-index: 40; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden">

    <aside class="w-64 bg-gray-900 text-white flex flex-col shrink-0 shadow-lg z-20">
        <div class="h-16 flex items-center justify-center font-black text-2xl bg-gray-950 border-b border-gray-800">Souq app</div>
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto custom-scrollbar">
            <a href="dashboard.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">الرئيسية</a>
            <a href="orders.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">إدارة الطلبات</a>
            <a href="reports.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">التقارير والإحصائيات</a>
            <a href="ads.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">إدارة الإعلانات</a>
            <a href="trader.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">إدارة التجار</a>
            <a href="clients.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">عملاء التطبيق</a>
            <a href="constant.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">إدارة الثوابت</a>
            <a href="users.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">موظفو النظام</a>
            <a href="quotations.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">فواتير سعر</a>
            <a href="accounting.html" class="block px-4 py-3 bg-blue-600 shadow-md rounded-lg transition-colors font-bold">الحسابات والسندات</a>
        </nav>
        <div class="p-4 border-t border-gray-800">
            <button id="logoutBtn" class="block text-center w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-lg transition-colors shadow">تسجيل الخروج</button>
        </div>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden relative">
        <header class="h-16 bg-[#0D1B6D] text-white shadow-sm flex items-center justify-between px-8 shrink-0 z-10">
            <h2 class="text-xl font-bold">الحسابات والسندات</h2>
        </header>

        <main class="flex-1 overflow-y-auto bg-gray-50 p-6 relative">
            <div class="max-w-5xl mx-auto space-y-6">
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 flex flex-wrap justify-between items-center text-center gap-4">
                    <div class="flex-1">
                        <div class="text-gray-500 text-sm font-bold mb-1">الرصيد الصافي</div>
                        <div id="stat-net" class="text-2xl font-black text-[#2E7D32]" dir="ltr">0</div>
                    </div>
                    <div class="w-px h-12 bg-gray-200 hidden md:block"></div>
                    <div class="flex-1">
                        <div class="text-gray-500 text-sm font-bold mb-1">إجمالي القبض</div>
                        <div id="stat-income" class="text-xl font-bold text-[#2E7D32]" dir="ltr">0</div>
                    </div>
                    <div class="w-px h-12 bg-gray-200 hidden md:block"></div>
                    <div class="flex-1">
                        <div class="text-gray-500 text-sm font-bold mb-1">إجمالي الصرف</div>
                        <div id="stat-expense" class="text-xl font-bold text-red-600" dir="ltr">0</div>
                    </div>
                </div>

                <div class="relative">
                    <i class="fas fa-search absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input type="number" id="search-input" onkeyup="renderAccounting()" placeholder="بحث برقم السند..." class="w-full bg-white border border-gray-300 text-gray-900 rounded-xl shadow-sm focus:ring-[#0D1B6D] focus:border-[#0D1B6D] block pr-12 p-3.5 outline-none transition-colors">
                </div>

                <div id="accountingContainer" class="space-y-4 pb-24"></div>
            </div>
        </main>

        <button onclick="openAccountingModal()" class="fab-button px-6 py-4 bg-[#4CAF50] hover:bg-green-600 text-white rounded-full shadow-lg flex items-center justify-center gap-3 transition-transform hover:scale-105 font-bold">
            <i class="fas fa-plus text-lg"></i> سند جديد
        </button>
    </div>

    <!-- النافذة المنبثقة للنماذج -->
    <div id="acc-modal" class="fixed inset-0 modal-overlay z-50 hidden-element flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto flex flex-col">
            <div class="p-6 border-b border-gray-200 flex justify-between items-center sticky top-0 bg-white z-10">
                <h3 id="modal-title" class="text-xl font-bold text-[#0D1B6D]">إضافة سند جديد</h3>
                <button onclick="closeModal('acc-modal')" class="text-gray-400 hover:text-red-500 transition-colors"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="acc-id">
                <div><label class="block text-sm font-bold text-gray-500 mb-1">رقم السند</label><input type="text" id="acc-doc-num" readonly placeholder="تلقائي" class="w-full bg-gray-100 border border-gray-200 text-gray-500 p-2.5 rounded-lg outline-none font-bold" dir="ltr"></div>
                <div class="border-t border-gray-100 pt-4 mt-2">
                    <label class="block text-sm font-bold text-gray-700 mb-2">نوع السند:</label>
                    <div class="flex gap-6">
                        <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="acc-type" value="قبض" checked class="w-4 h-4 text-green-600"><span class="font-bold text-[#2E7D32]">قبض</span></label>
                        <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="acc-type" value="صرف" class="w-4 h-4 text-red-600"><span class="font-bold text-red-600">صرف</span></label>
                    </div>
                </div>
                <div><label class="block text-sm font-bold text-gray-700 mb-1">المبلغ <span class="text-red-500">*</span></label><input type="number" id="acc-amount" step="any" class="w-full border border-gray-300 p-2.5 rounded-lg focus:outline-none focus:border-[#0D1B6D] text-left" dir="ltr" placeholder="0.0"></div>
                <div><label class="block text-sm font-bold text-gray-700 mb-1">التفاصيل / البيان <span class="text-red-500">*</span></label><textarea id="acc-details" rows="3" class="w-full border border-gray-300 p-2.5 rounded-lg focus:outline-none focus:border-[#0D1B6D] resize-none"></textarea></div>
                <div><label class="block text-sm font-bold text-gray-700 mb-1">تاريخ السند</label><input type="date" id="acc-date" class="w-full border border-gray-300 p-2.5 rounded-lg focus:outline-none focus:border-[#0D1B6D]"></div>
            </div>
            <div class="p-6 border-t border-gray-200 bg-gray-50 flex justify-end gap-3 rounded-b-2xl sticky bottom-0">
                <button onclick="closeModal('acc-modal')" class="px-6 py-2.5 text-gray-600 font-bold bg-gray-200 rounded-lg">إلغاء</button>
                <button onclick="saveAccounting()" class="px-8 py-2.5 bg-[#0D1B6D] text-white font-bold rounded-lg shadow-md">حفظ السند</button>
            </div>
        </div>
    </div>

    <div id="delete-modal" class="fixed inset-0 modal-overlay z-50 hidden-element flex items-center justify-center p-4">
        <!-- نافذة الحذف -->
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 text-center">
            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4"><i class="fas fa-exclamation-triangle text-3xl text-red-600"></i></div>
            <h3 class="text-xl font-bold text-gray-800 mb-2">تأكيد الحذف</h3>
            <p class="text-gray-500 mb-6" id="delete-message">هل أنت متأكد من الحذف؟</p>
            <div class="flex gap-3 justify-center">
                <button onclick="closeModal('delete-modal')" class="flex-1 px-4 py-2 bg-gray-100 font-bold rounded-lg">إلغاء</button>
                <button id="confirm-delete-btn" class="flex-1 px-4 py-2 bg-red-600 text-white font-bold rounded-lg">حذف</button>
            </div>
        </div>
    </div>

    <div id="toast-message" class="fixed top-4 left-1/2 transform -translate-x-1/2 text-white px-6 py-3 rounded-xl shadow-lg hidden-element transition-opacity z-50 flex items-center gap-3"><i id="toast-icon" class="fas fa-check-circle text-xl"></i> <span id="toast-text" class="font-bold"></span></div>

    <!-- Firebase + Auth -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script> <!-- تمت الإضافة -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyA-ta3tPT5QYEPvnXTb8RBSidsnINY7akg", authDomain: "souqalghiyar.firebaseapp.com", projectId: "souqalghiyar", storageBucket: "souqalghiyar.firebasestorage.app", messagingSenderId: "186585426069", appId: "1:186585426069:web:9f34cedeee498d1bd3539c" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let accountingData = [];
        let deleteTargetId = null;

        // التأكد من المصادقة قبل جلب البيانات
        window.onload = function() {
            firebase.auth().onAuthStateChanged(function(user) {
                const userRole = sessionStorage.getItem('userRole');

                // التوجيه إلى صفحة الدخول إذا انتهت الجلسة أو لا توجد بيانات الصلاحية
                if (user && userRole) {
                    fetchAccounting();
                } else {
                    sessionStorage.clear();
                    window.location.replace("index.html");
                }
            });
        };

        // حدث زر تسجيل الخروج
        document.getElementById('logoutBtn').addEventListener('click', () => {
            firebase.auth().signOut().then(() => {
                sessionStorage.clear();
                window.location.replace("index.html");
            });
        });

        function fetchAccounting() {
            db.collection('accounting').onSnapshot((snapshot) => {
                accountingData = [];
                snapshot.forEach((doc) => {
                    let data = doc.data();
                    data.documentId = doc.id;
                    accountingData.push(data);
                });
                accountingData.sort((a, b) => new Date(b.date) - new Date(a.date));
                renderAccounting();
            });
        }

        function renderAccounting() {
            let container = document.getElementById('accountingContainer');
            let query = document.getElementById('search-input').value.trim();
            let totalIncome = 0, totalExpense = 0, count = 0, htmlStr = '';

            for (let i = 0; i < accountingData.length; i++) {
                let acc = accountingData[i];
                if (acc.type === 'قبض') totalIncome += acc.amount;
                else if (acc.type === 'صرف') totalExpense += acc.amount;

                if (query && acc.doc_number.toString() !== query) continue;
                count++;

                let isIncome = acc.type === 'قبض';
                let colorPrimary = isIncome ? 'text-[#2E7D32]' : 'text-[#D32F2F]';
                let colorBg = isIncome ? 'bg-[#E8F5E9]' : 'bg-[#FFEBEE]';
                let iconClass = isIncome ? 'fa-arrow-down' : 'fa-arrow-up';

                htmlStr += '<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 hover:shadow-md transition-shadow"><div class="flex items-start gap-4 flex-1"><div class="w-12 h-12 rounded-xl flex items-center justify-center shrink-0 ' + colorBg + ' ' + colorPrimary + '"><i class="fas ' + iconClass + ' text-xl"></i></div><div class="flex-1"><div class="flex justify-between items-center mb-1"><h3 class="font-bold text-lg ' + colorPrimary + '">سند ' + acc.type + ' #' + acc.doc_number + '</h3><span class="font-black text-lg" dir="ltr">' + acc.amount + '</span></div><p class="text-gray-700 text-sm mb-2">' + acc.details + '</p><div class="text-gray-500 text-xs flex items-center gap-1"><i class="fas fa-calendar-alt w-3"></i> ' + acc.date + '</div></div></div><div class="flex gap-2 self-end md:self-center shrink-0"><button onclick="openAccountingModal(\'' + acc.documentId + '\')" class="w-9 h-9 rounded-full bg-blue-50 text-blue-600 hover:bg-blue-100 flex items-center justify-center transition-colors"><i class="fas fa-edit text-sm"></i></button><button onclick="attemptDelete(\'' + acc.documentId + '\', \'' + acc.doc_number + '\')" class="w-9 h-9 rounded-full bg-red-50 text-red-600 hover:bg-red-100 flex items-center justify-center transition-colors"><i class="fas fa-trash text-sm"></i></button></div></div>';
            }

            if(count === 0) htmlStr = '<div class="text-center py-20 text-gray-400"><i class="fas fa-receipt text-6xl mb-4 opacity-50"></i><h3 class="text-xl font-bold">لا توجد سندات</h3></div>';
            container.innerHTML = htmlStr;

            let netTotal = totalIncome - totalExpense;
            let statNet = document.getElementById('stat-net');
            document.getElementById('stat-income').innerText = totalIncome;
            document.getElementById('stat-expense').innerText = totalExpense;
            statNet.innerText = netTotal;
            statNet.className = netTotal >= 0 ? "text-2xl font-black text-[#2E7D32]" : "text-2xl font-black text-red-600";
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden-element'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden-element'); }

        function openAccountingModal(id) {
            let titleEl = document.getElementById('modal-title');
            if (id) {
                titleEl.innerText = "تعديل السند";
                let acc = accountingData.find(x => x.documentId === id);
                document.getElementById('acc-id').value = acc.documentId;
                document.getElementById('acc-doc-num').value = acc.doc_number;
                document.getElementById('acc-amount').value = acc.amount;
                document.getElementById('acc-details').value = acc.details;
                document.getElementById('acc-date').value = acc.date;
                document.querySelector('input[name="acc-type"][value="' + acc.type + '"]').checked = true;
            } else {
                titleEl.innerText = "إضافة سند جديد";
                document.getElementById('acc-id').value = ""; document.getElementById('acc-doc-num').value = "";
                document.getElementById('acc-amount').value = ""; document.getElementById('acc-details').value = "";
                document.getElementById('acc-date').value = new Date().toISOString().split('T')[0];
                document.querySelector('input[name="acc-type"][value="قبض"]').checked = true;
            }
            openModal('acc-modal');
        }

        function saveAccounting() {
            let id = document.getElementById('acc-id').value;
            let amount = parseFloat(document.getElementById('acc-amount').value.trim()) || 0;
            let details = document.getElementById('acc-details').value.trim();
            let dateStr = document.getElementById('acc-date').value;
            let type = document.querySelector('input[name="acc-type"]:checked').value;

            if(!amount || !details || !dateStr) { showToast("يرجى تعبئة المبلغ والتفاصيل والتاريخ", false); return; }

            if (id) {
                db.collection('accounting').doc(id).update({ type, amount, details, date: dateStr }).then(() => { closeModal('acc-modal'); showToast("تم التعديل بنجاح", true); });
            } else {
                let maxDocNum = accountingData.reduce((max, acc) => acc.doc_number > max ? acc.doc_number : max, 0);
                db.collection('accounting').add({ doc_number: maxDocNum + 1, type, amount, details, date: dateStr }).then(() => { closeModal('acc-modal'); showToast("تم حفظ السند بنجاح", true); });
            }
        }

        function attemptDelete(id, docNum) {
            deleteTargetId = id;
            document.getElementById('delete-message').innerText = "هل أنت متأكد من رغبتك في حذف السند رقم " + docNum + " نهائياً؟";
            document.getElementById('confirm-delete-btn').onclick = executeDelete;
            openModal('delete-modal');
        }

        function executeDelete() {
            db.collection('accounting').doc(deleteTargetId).delete().then(() => {
                closeModal('delete-modal'); showToast("تم حذف السند بنجاح", true);
            });
        }

        function showToast(message, isSuccess) {
            let toast = document.getElementById('toast-message'), icon = document.getElementById('toast-icon');
            document.getElementById('toast-text').innerText = message;
            toast.className = isSuccess ? "fixed top-4 left-1/2 transform -translate-x-1/2 bg-[#4CAF50] text-white px-6 py-3 rounded-xl shadow-lg transition-opacity z-50 flex items-center gap-3" : "fixed top-4 left-1/2 transform -translate-x-1/2 bg-red-600 text-white px-6 py-3 rounded-xl shadow-lg transition-opacity z-50 flex items-center gap-3";
            icon.className = isSuccess ? "fas fa-check-circle text-xl" : "fas fa-exclamation-triangle text-xl";
            toast.classList.remove('hidden-element');
            setTimeout(() => toast.classList.add('hidden-element'), 4000);
        }
    </script>
</body>
</html>
