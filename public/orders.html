<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الطلبات | Souq app</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .order-details { display: none; }
        .order-details.open { display: block; }
    </style>
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden">

    <!-- القائمة الجانبية -->
    <aside class="w-64 bg-gray-900 text-white flex flex-col shrink-0 shadow-lg z-20">
        <div class="h-16 flex items-center justify-center font-black text-2xl bg-gray-950 border-b border-gray-800">Souq app</div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="dashboard.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">الرئيسية</a>
            <a href="orders.html" class="block px-4 py-3 bg-blue-600 shadow-md rounded-lg transition-colors font-bold">إدارة الطلبات</a>
            <a href="reports.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">التقارير والإحصائيات</a>
            <a href="ads.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">إدارة الإعلانات</a>
            <a href="trader.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">إدارة التجار</a>
            <a href="clients.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">عملاء التطبيق</a>
        </nav>
        <div class="p-4 border-t border-gray-800">
            <a href="index.html" class="block text-center w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-lg transition-colors shadow">تسجيل الخروج</a>
        </div>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="h-16 bg-white shadow-sm flex items-center justify-between px-8 shrink-0 z-10 border-b border-gray-200">
            <h2 class="text-xl font-bold text-gray-800">إدارة الطلبات</h2>
            <div class="flex items-center gap-6">
                <button onclick="fetchOrders()" class="text-blue-600 hover:text-blue-800 font-bold transition flex items-center gap-2">
                    <i class="fas fa-sync-alt"></i> تحديث البيانات
                </button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto bg-gray-50 flex flex-col relative">
            <div class="flex bg-[#0D1B6D] text-gray-300 px-4 overflow-x-auto border-b-4 border-[#0D1B6D] sticky top-0 z-10 shadow-md" id="tabsContainer"></div>
            <div class="p-6 max-w-7xl w-full mx-auto" id="ordersContainer"></div>
        </main>
    </div>

    <!-- استدعاء فايربيس (مع Auth) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script> <!-- تمت الإضافة -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA-ta3tPT5QYEPvnXTb8RBSidsnINY7akg",
            authDomain: "souqalghiyar.firebaseapp.com",
            projectId: "souqalghiyar",
            storageBucket: "souqalghiyar.firebasestorage.app",
            messagingSenderId: "186585426069",
            appId: "1:186585426069:web:9f34cedeee498d1bd3539c"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        const db = firebase.firestore();
        const messaging = firebase.messaging();

        const tabs = [
            { id: 'pending', label: 'المعلقة' },
            { id: 'waiting admin approvel', label: 'الموافقة الإدارية' },
            { id: 'waiting for approvel', label: 'قيد موافقة العميل' },
            { id: 'going', label: 'جاري التوصيل' }
        ];
        
        let currentTab = 'pending';
        let ordersData = [];

        // التأكد من المصادقة قبل جلب البيانات
        window.onload = function() {
            firebase.auth().onAuthStateChanged(function(user) {
                if (user) {
                    fetchOrders();
                    requestNotificationPermission();
                } else {
                    window.location.href = "index.html";
                }
            });
        };

        function renderTabs() {
            const tabsContainer = document.getElementById('tabsContainer');
            tabsContainer.innerHTML = '';
            tabs.forEach(tab => {
                let isActive = tab.id === currentTab;
                let button = document.createElement('button');
                let activeClass = isActive ? 'border-[#4CAF50] text-white bg-white/5' : 'border-transparent hover:text-white hover:bg-white/5';
                button.className = 'px-8 py-3.5 font-bold transition-colors duration-300 border-b-4 whitespace-nowrap text-[15px] ' + activeClass;
                button.innerText = tab.label;
                button.onclick = () => { currentTab = tab.id; renderTabs(); renderOrders(); };
                tabsContainer.appendChild(button);
            });
        }

        function renderOrders() {
            const container = document.getElementById('ordersContainer');
            const filteredOrders = ordersData.filter(o => o.order_status === currentTab);

            if (filteredOrders.length === 0) {
                container.innerHTML = '<div class="flex flex-col items-center justify-center py-20 text-gray-400"><i class="fas fa-box-open text-6xl mb-4"></i><div class="text-xl font-bold">لا توجد طلبات هنا حالياً</div></div>';
                return;
            }

            let finalHtml = '<div class="space-y-5">';
            filteredOrders.forEach(order => {
                let isPending = currentTab === 'pending';
                let isAdminApproval = currentTab === 'waiting admin approvel';
                let isGoing = currentTab === 'going';

                let statusText = isPending ? 'معلق قيد التسعير' : isAdminApproval ? 'بانتظار الموافقة الإدارية' : isGoing ? 'جاري التوصيل' : 'بانتظار موافقة العميل';
                let statusColor = isPending ? 'bg-yellow-100 text-yellow-800 border-yellow-200' : isAdminApproval ? 'bg-orange-100 text-orange-800 border-orange-200' : isGoing ? 'bg-blue-100 text-blue-800 border-blue-200' : 'bg-green-100 text-green-800 border-green-200';

                order.items = order.items || [];
                let itemsHtml = '';
                
                order.items.forEach((item, j) => {
                    let bgClass = j % 2 !== 0 ? 'bg-gray-50' : 'bg-white';
                    let disabledAttr = (isPending || isAdminApproval || isGoing) ? '' : 'disabled';
                    
                    let nameField = isPending ? '<input type="text" class="border border-gray-300 p-2 w-full rounded focus:outline-none focus:border-blue-500 font-medium" value="' + (item.part_name || '') + '" onchange="updateItem(\'' + order.order_id + '\', \'' + item.item_id + '\', \'part_name\', this.value)">' : (item.part_name || '');
                    let pricingFields = (isPending || isAdminApproval) ? '<td class="p-3"><input type="number" class="border border-gray-300 p-2 w-28 text-center rounded focus:border-blue-500" value="' + (item.quotation_price || '') + '" onchange="updateItem(\'' + order.order_id + '\', \'' + item.item_id + '\', \'quotation_price\', this.value)"></td><td class="p-3"><input type="number" class="border border-gray-300 p-2 w-28 text-center rounded focus:border-blue-500 text-green-700" value="' + (item.selling_price || '') + '" onchange="updateItem(\'' + order.order_id + '\', \'' + item.item_id + '\', \'selling_price\', this.value)"></td>' : '';
                    let purchaseField = isGoing ? '<td class="p-3"><input type="number" class="border border-gray-300 p-2 w-28 text-center rounded focus:border-blue-500 text-red-600" value="' + (item.purchase_price || '') + '" onchange="updateItem(\'' + order.order_id + '\', \'' + item.item_id + '\', \'purchase_price\', this.value)"></td>' : '';
                    let traderField = '<input type="text" placeholder="اسم التاجر" class="border border-gray-300 p-2 rounded w-full focus:border-blue-500" value="'+(item.trader_name||'')+'" onchange="updateItem(\'' + order.order_id + '\', \'' + item.item_id + '\', \'trader_name\', this.value)" ' + disabledAttr + '>';
                    let invoiceVal = isGoing ? (item.invoice_number || '') : (item.quotation_number || '');
                    let invoiceFieldType = isGoing ? 'invoice_number' : 'quotation_number';

                    itemsHtml += '<tr class="border-b ' + bgClass + '"><td class="p-3 font-bold">' + nameField + '</td><td class="p-3 whitespace-nowrap">' + (item.quality_type || '') + ' | كمية: <span class="font-black bg-gray-200 px-2 rounded">' + (item.quantity || 1) + '</span></td>' + pricingFields + purchaseField + '<td class="p-3 min-w-[140px]">' + traderField + '</td><td class="p-3"><input type="text" class="border border-gray-300 p-2 w-32 rounded text-center focus:border-blue-500 uppercase" placeholder="رقم الفاتورة" value="' + invoiceVal + '" onchange="updateItem(\'' + order.order_id + '\', \'' + item.item_id + '\', \'' + invoiceFieldType + '\', this.value)" ' + disabledAttr + '></td></tr>';
                });

                let orderHtml = '<div class="bg-white rounded-xl shadow-[0_2px_10px_-3px_rgba(6,81,237,0.1)] border border-gray-200 overflow-hidden hover:shadow-md"><div class="p-5 cursor-pointer flex justify-between items-start" onclick="toggleDetails(\'' + order.order_id + '\')"><div class="flex-1"><div class="flex items-center gap-3 mb-3"><span class="text-[#D32F2F] font-black text-lg">طلب رقم: #' + (order.order_number || '') + '</span><span class="px-3 py-1 rounded-full text-xs font-bold border ' + statusColor + '">' + statusText + '</span></div><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-3 text-sm"><div class="text-[#0D1B6D] font-bold text-[15px] lg:col-span-1">المركبة: ' + (order.vehicle_name || '') + ' - ' + (order.vehicle_model || '') + '</div><div class="text-gray-600"><i class="fas fa-user text-gray-400 ml-1"></i> الهاتف: ' + (order.user_number || '') + '</div><div class="text-gray-600"><i class="fas fa-industry text-gray-400 ml-1"></i> القاعدة (VIN): <span class="uppercase tracking-wide">' + (order.vin_number || '') + '</span></div><div class="text-gray-600"><i class="fas fa-map-marker-alt text-gray-400 ml-1"></i> الموقع: ' + (order.delivery_location || '') + '</div></div></div><div class="w-10 h-10 rounded-full flex items-center justify-center bg-gray-50 hover:bg-gray-100 border border-gray-200 ml-2"><i id="icon-' + order.order_id + '" class="fas fa-chevron-down text-[#0D1B6D]"></i></div></div>';
                orderHtml += '<div id="details-' + order.order_id + '" class="order-details p-5 border-t border-gray-200 bg-slate-50/50"><h3 class="font-bold text-blue-600 mb-4 flex items-center gap-2"><i class="fas fa-cogs"></i> القطع والتسعير</h3><div class="overflow-x-auto mb-5 rounded-lg border border-gray-200 shadow-sm"><table class="w-full text-sm text-right border-collapse bg-white min-w-[800px]"><thead class="bg-[#0D1B6D] text-white"><tr><th class="p-3">القطعة</th><th class="p-3">النوع/الكمية</th>' + (isPending || isAdminApproval ? '<th class="p-3">مبلغ العرض</th><th class="p-3">سعر البيع</th>' : '') + (isGoing ? '<th class="p-3">سعر الشراء</th>' : '') + '<th class="p-3">التاجر</th><th class="p-3">رقم الفاتورة</th></tr></thead><tbody>' + itemsHtml + '</tbody></table></div>';
                
                if(isPending) orderHtml += '<button class="text-[#4CAF50] font-bold flex items-center gap-2 mb-6 hover:bg-green-50 px-4 py-2 rounded border border-green-200 bg-white" onclick="addNewItem(\'' + order.order_id + '\')"><i class="fas fa-plus"></i> إضافة صنف</button>';
                
                if(isPending || isAdminApproval) orderHtml += '<div class="mb-6 w-full md:w-1/4"><label class="block text-sm font-bold text-gray-700 mb-2">رسوم التوصيل:</label><input type="number" class="border border-gray-300 focus:border-[#0D1B6D] p-2.5 rounded w-full font-bold text-lg" value="' + (order.delivery_fees || '') + '" onchange="updateDeliveryFees(\'' + order.order_id + '\', this.value)"></div>';

                let actionsHtml = '';
                if(isPending) actionsHtml = '<button onclick="processOrder(\'' + order.order_id + '\', \'canceled\')" class="px-6 py-2.5 text-red-600 font-bold hover:bg-red-50 rounded transition">إلغاء الطلب</button><button onclick="processOrder(\'' + order.order_id + '\', \'waiting admin approvel\')" class="px-8 py-2.5 bg-[#0D1B6D] text-white font-bold rounded shadow-md hover:bg-blue-900">اعتماد للإدارة</button>';
                else if(isAdminApproval) actionsHtml = '<button onclick="processOrder(\'' + order.order_id + '\', \'pending\')" class="px-6 py-2.5 text-[#E65100] font-bold hover:bg-orange-50 rounded transition">إعادة للمراجعة</button><button onclick="processOrder(\'' + order.order_id + '\', \'waiting for approvel\')" class="px-8 py-2.5 bg-[#4CAF50] text-white font-bold rounded shadow-md hover:bg-green-600">اعتماد نهائي</button>';
                else if(isGoing) actionsHtml = '<button onclick="processOrder(\'' + order.order_id + '\', \'canceled\')" class="px-6 py-2.5 text-red-500 font-bold hover:bg-red-50 border border-red-500 rounded transition">إلغاء (إرجاع)</button><button onclick="processOrder(\'' + order.order_id + '\', \'completed\')" class="px-8 py-2.5 bg-[#4CAF50] text-white font-bold rounded shadow-md hover:bg-green-600">إنهاء بنجاح</button>';
                
                orderHtml += '<div class="flex justify-end gap-3 mt-8 border-t border-gray-200 pt-5">' + actionsHtml + '</div></div></div>';
                finalHtml += orderHtml;
            });
            container.innerHTML = finalHtml + '</div>';
        }

        function toggleDetails(orderId) {
            const detailsDiv = document.getElementById('details-' + orderId), icon = document.getElementById('icon-' + orderId);
            detailsDiv.classList.toggle('open');
            icon.classList.toggle('fa-chevron-down'); icon.classList.toggle('fa-chevron-up');
        }

        function fetchOrders() {
            renderTabs();
            document.getElementById('ordersContainer').innerHTML = '<div class="flex justify-center py-20"><i class="fas fa-spinner fa-spin text-4xl text-blue-600"></i></div>';
            db.collection('orders').onSnapshot((snapshot) => {
                ordersData = [];
                if (!snapshot.empty) {
                    snapshot.forEach(doc => {
                        let order = doc.data();
                        order.order_id = doc.id;
                        order.order_status = (order.order_status || 'pending').toLowerCase().trim();
                        ordersData.push(order);
                    });
                }
                renderOrders();
            });
        }

        function updateItem(orderId, itemId, field, value) {
            let order = ordersData.find(o => o.order_id === orderId);
            if (order && order.items) {
                let itemIndex = order.items.findIndex(i => i.item_id === itemId);
                if (itemIndex !== -1) {
                    let finalValue = (field.includes('price')) ? (parseFloat(value) || 0) : value;
                    order.items[itemIndex][field] = finalValue;
                    db.collection('orders').doc(orderId).update({ items: order.items });
                }
            }
        }

        function updateDeliveryFees(orderId, value) {
            db.collection('orders').doc(orderId).update({ delivery_fees: parseFloat(value) || 0 });
        }

        function addNewItem(orderId) {
            let order = ordersData.find(o => o.order_id === orderId);
            if(order) {
                let currentItems = order.items || [];
                currentItems.push({ item_id: "ITEM-" + Date.now(), part_name: "صنف جديد", quality_type: "-", quantity: 1, quotation_price: 0, selling_price: 0, trader_name: "", quotation_number: "", purchase_price: 0, invoice_number: "" });
                db.collection('orders').doc(orderId).update({ items: currentItems }).then(() => setTimeout(() => { let d = document.getElementById('details-' + orderId); if(d && !d.classList.contains('open')) toggleDetails(orderId); }, 100));
            }
        }

        function processOrder(orderId, newStatus) {
            if (newStatus === 'canceled' && !confirm("هل أنت متأكد من إلغاء الطلب؟")) return;
            db.collection('orders').doc(orderId).update({ order_status: newStatus });
        }

        function requestNotificationPermission() {
            Notification.requestPermission().then((permission) => {
                if (permission === 'granted') {
                    messaging.getToken({ vapidKey: 'BPncXmrgoDlb__z2uDh6POxoQ2WkmvdCMm5PFp58sJc_ZfRo3pHhm_cf2S_u4_D4gDj-JKH-WCHHslqmVrje72A' }).then(token => {
                        if (token) console.log("FCM:", token);
                    });
                }
            });
        }

        messaging.onMessage((payload) => {
            const title = payload.data?.title || payload.notification?.title || "إشعار جديد";
            const message = payload.data?.message || payload.notification?.body || "";
            showFCMToast(title, message);
        });

        function showFCMToast(title, message) {
            let container = document.getElementById('fcm-toast-container');
            if (!container) { container = document.createElement('div'); container.id = 'fcm-toast-container'; container.className = 'fixed top-4 left-4 z-50 flex flex-col gap-3'; document.body.appendChild(container); }
            const toast = document.createElement('div');
            toast.className = 'bg-[#0D1B6D] text-white px-5 py-4 rounded-xl shadow-2xl transform transition-all duration-500 translate-y-[-100%] opacity-0 flex items-start gap-4 w-80 cursor-pointer border border-blue-800';
            toast.onclick = () => { currentTab = 'pending'; fetchOrders(); toast.remove(); };
            toast.innerHTML = `<div class="bg-blue-500/20 p-3 rounded-full shrink-0"><i class="fas fa-bell text-blue-300 text-xl animate-pulse"></i></div><div class="flex-1"><h4 class="font-bold text-sm mb-1 text-blue-100">${title}</h4><p class="text-xs text-gray-300 leading-relaxed">${message}</p></div><button class="shrink-0 text-gray-400 hover:text-white" onclick="event.stopPropagation(); this.parentElement.remove()"><i class="fas fa-times"></i></button>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-[-100%]', 'opacity-0'), 100);
            setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-[-100%]'); setTimeout(() => toast.remove(), 500); }, 6000);
        }
    </script>
</body>
</html>
