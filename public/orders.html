<div class="flex-1 flex flex-col overflow-hidden">

<!-- استدعاء فايربيس (مع Auth) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>

<script>
const firebaseConfig = {
apiKey: "AIzaSyA-ta3tPT5QYEPvnXTb8RBSidsnINY7akg",
authDomain: "souqalghiyar.firebaseapp.com",
projectId: "souqalghiyar",
storageBucket: "souqalghiyar.firebasestorage.app",
messagingSenderId: "186585426069",
appId: "1:186585426069:web:9f34cedeee498d1bd3539c"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let messaging = null;
try {
    if(firebase.messaging.isSupported()) {
        messaging = firebase.messaging();
    }
} catch(e) {
    console.warn("Messaging not supported.");
}

// تحويل tabs إلى let لنتمكن من إخفاء تبويب الموافقة الإدارية
let tabs = [
{ id: 'pending', label: 'المعلقة' },
{ id: 'waiting admin approvel', label: 'الموافقة الإدارية' },
{ id: 'waiting for approvel', label: 'قيد موافقة العميل' },
{ id: 'going', label: 'جاري التوصيل' }
];

let currentTab = 'pending';
let ordersData = [];
let clientsData = {};
let adminUsername = "موظف";
let openOrders = new Set(); 

window.onload = function() {
    // التحقق الآمن والمستمر من الجلسة
    firebase.auth().onAuthStateChanged(function(user) {
        const userRole = sessionStorage.getItem('userRole');
        const displayName = sessionStorage.getItem('displayName');

        if (user && userRole) {
            // أخذ الاسم من الجلسة لحفظه لاحقاً في الطلبات
            adminUsername = displayName || "موظف";
            let nameDisplay = document.getElementById('adminNameDisplay');
            if(nameDisplay) nameDisplay.innerText = "أهلاً، " + adminUsername;

            // إخفاء تاب "الموافقة الإدارية" وصفحات القائمة للموظفين
            if (userRole === 'employee') {
                tabs = tabs.filter(tab => tab.id !== 'waiting admin approvel');
                
                const adminOnlyElements = ['nav-ads', 'nav-trader', 'nav-clients'];
                adminOnlyElements.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.style.display = 'none';
                });
            }
            
            fetchOrders();
            if(messaging) requestNotificationPermission();
        } else {
            // طرد المستخدم إذا لم يمتلك جلسة سليمة أو دخل برابط مباشر
            sessionStorage.clear();
            window.location.replace("index.html");
        }
    });
};

// حدث زر تسجيل الخروج
document.getElementById('logoutBtn').addEventListener('click', () => {
    firebase.auth().signOut().then(() => {
        sessionStorage.clear();
        window.location.replace("index.html");
    });
});

function safeStr(str) {
    if (!str && str !== 0) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function renderTabs() {
    const tabsContainer = document.getElementById('tabsContainer');
    tabsContainer.innerHTML = '';
    tabs.forEach(tab => {
        let isActive = tab.id === currentTab;
        let button = document.createElement('button');
        let activeClass = isActive ? 'border-[#4CAF50] text-white bg-white/5' : 'border-transparent hover:text-white hover:bg-white/5';
        button.className = 'px-8 py-3.5 font-bold transition-colors duration-300 border-b-4 whitespace-nowrap text-[15px] ' + activeClass;
        button.innerText = tab.label;
        button.onclick = () => { currentTab = tab.id; renderTabs(); renderOrders(); };
        tabsContainer.appendChild(button);
    });
}

function fetchOrders() {
    renderTabs();
    document.getElementById('ordersContainer').innerHTML = '<div class="flex justify-center py-20"><i class="fas fa-spinner fa-spin text-4xl text-blue-600"></i></div>';
    
    db.collection('orders').onSnapshot(async (snapshot) => {
        let tempOrders = [];
        for (let doc of snapshot.docs) {
            let order = doc.data();
            order.order_id = doc.id;
            order.order_status = (order.order_status || 'pending').toLowerCase().trim();
            tempOrders.push(order);
        }
        
        for (let order of tempOrders) {
            try {
                let itemsSnap = await db.collection('orders').doc(order.order_id).collection('items').get();
                if (!itemsSnap.empty) {
                    order.items = [];
                    itemsSnap.forEach(iDoc => {
                        let itemData = iDoc.data();
                        itemData.item_id = iDoc.id;
                        order.items.push(itemData);
                    });
                } else {
                    order.items = Array.isArray(order.items) ? order.items : [];
                }
            } catch(e) {
                order.items = Array.isArray(order.items) ? order.items : [];
            }
            fetchClientInfo(order.user_id, order.order_id);
        }
        
        ordersData = tempOrders.sort((a, b) => {
            let t1 = a.created_at ? (a.created_at.seconds || 0) : 0;
            let t2 = b.created_at ? (b.created_at.seconds || 0) : 0;
            return t2 - t1;
        });
        
        renderOrders();
    });
}

async function fetchClientInfo(userId, orderId) {
    if (!userId) return;
    if (clientsData[userId]) {
        updateClientDOM(orderId, clientsData[userId]);
        return;
    }
    try {
        let doc = await db.collection('users').doc(userId).get();
        if (doc.exists) {
            let data = doc.data();
            let name = data.type === 'تجاري' ? (data.trade_name || 'غير متوفر') : (data.display_name || 'غير متوفر');
            let whats = data.whats_number || 'غير متوفر';
            clientsData[userId] = { name: name, whats: whats };
            updateClientDOM(orderId, clientsData[userId]);
        }
    } catch (e) {}
}

function updateClientDOM(orderId, client) {
    let nameEl = document.getElementById('client-name-' + orderId);
    let whatsEl = document.getElementById('client-whats-' + orderId);
    if(nameEl) nameEl.innerText = 'اسم العميل: ' + client.name;
    if(whatsEl) whatsEl.innerText = 'رقم الواتساب: ' + client.whats;
}

function renderOrders() {
    const container = document.getElementById('ordersContainer');
    const filteredOrders = ordersData.filter(o => o.order_status === currentTab || (currentTab === 'waiting for approvel' && (o.order_status === 'waiting for approval' || o.order_status === 'waiting for approvel')));

    if (filteredOrders.length === 0) {
        container.innerHTML = '<div class="flex flex-col items-center justify-center py-20 text-gray-400"><i class="fas fa-box-open text-6xl mb-4"></i><div class="text-xl font-bold">لا توجد طلبات هنا حالياً</div></div>';
        return;
    }

    let finalHtml = '<div class="space-y-5">';
    filteredOrders.forEach(order => {
        let isPending = currentTab === 'pending';
        let isAdminApproval = currentTab === 'waiting admin approvel';
        let isGoing = currentTab === 'going';

        let statusText = isPending ? 'معلق قيد التسعير' : isAdminApproval ? 'بانتظار الموافقة الإدارية' : isGoing ? 'جاري التوصيل' : 'بانتظار موافقة العميل';
        let statusColor = isPending ? 'bg-yellow-100 text-yellow-800 border-yellow-200' : isAdminApproval ? 'bg-orange-100 text-orange-800 border-orange-200' : isGoing ? 'bg-blue-100 text-blue-800 border-blue-200' : 'bg-green-100 text-green-800 border-green-200';

        order.items = order.items || [];
        let itemsHtml = '';
        order.items.forEach((item, j) => {
            let bgClass = j % 2 !== 0 ? 'bg-gray-50' : 'bg-white';
            let disabledAttr = (isPending || isAdminApproval || isGoing) ? '' : 'disabled';
            
            let s_part = safeStr(item.part_name);
            let s_trader = safeStr(item.trader_name);
            
            let nameField = isPending ? '<div class="flex gap-2"><input type="text" class="border border-gray-300 p-2 w-full rounded focus:outline-none focus:border-blue-500 font-medium" value="' + s_part + '" onchange="updateSubItem(\'' + order.order_id + '\', \'' + item.item_id + '\', \'part_name\', this.value)">' + (order.items.length > 1 ? '<button onclick="deleteItem(\'' + order.order_id + '\', \'' + item.item_id + '\')" class="text-red-500 hover:text-red-700 px-2"><i class="fas fa-trash"></i></button>' : '') + '</div>' : s_part;
            
            let pricingFields = (isPending || isAdminApproval) ? '<td class="p-3"><input type="number" class="border border-gray-300 p-2 w-28 text-center rounded focus:border-blue-500" value="' + (item.quotation_price || '') + '" onchange="updateSubItem(\'' + order.order_id + '\', \'' + item.item_id + '\', \'quotation_price\', this.value)"></td><td class="p-3"><input type="number" class="border border-gray-300 p-2 w-28 text-center rounded focus:border-blue-500 text-green-700" value="' + (item.selling_price || '') + '" onchange="updateSubItem(\'' + order.order_id + '\', \'' + item.item_id + '\', \'selling_price\', this.value)"></td>' : '';
            
            let purchaseField = isGoing ? '<td class="p-3"><input type="number" class="border border-gray-300 p-2 w-28 text-center rounded focus:border-blue-500 text-red-600" value="' + (item.purchase_price || '') + '" onchange="updateSubItem(\'' + order.order_id + '\', \'' + item.item_id + '\', \'purchase_price\', this.value)"></td>' : '';
            
            let traderField = '<input type="text" placeholder="اسم التاجر" class="border border-gray-300 p-2 rounded w-full focus:border-blue-500" value="' + s_trader + '" onchange="updateSubItem(\'' + order.order_id + '\', \'' + item.item_id + '\', \'trader_name\', this.value)" ' + disabledAttr + '>';
            
            let invoiceVal = isGoing ? safeStr(item.invoice_number) : safeStr(item.quotation_number);
            let invoiceFieldType = isGoing ? 'invoice_number' : 'quotation_number';

            let invoiceCol = '<input type="text" class="border border-gray-300 p-2 w-32 rounded text-center focus:border-blue-500 uppercase" placeholder="رقم الفاتورة" value="' + invoiceVal + '" onchange="updateSubItem(\'' + order.order_id + '\', \'' + item.item_id + '\', \'' + invoiceFieldType + '\', this.value)" ' + disabledAttr + '>';
            
            if(isAdminApproval) {
                invoiceCol += '<button onclick="saveQuotationPrice(\'' + order.order_id + '\', \'' + item.item_id + '\')" class="text-xs text-blue-600 hover:text-blue-800 font-bold block mt-2 mx-auto">حفظ العرض</button>';
            }

            itemsHtml += '<tr class="border-b ' + bgClass + '"><td class="p-3 font-bold">' + nameField + '</td><td class="p-3 whitespace-nowrap">' + safeStr(item.quality_type) + ' | كمية: <span class="font-black bg-gray-200 px-2 rounded">' + (item.quantity || 1) + '</span></td>' + pricingFields + purchaseField + '<td class="p-3 min-w-[140px]">' + traderField + '</td><td class="p-3">' + invoiceCol + '</td></tr>';
        });

        let orderHtml = '<div class="bg-white rounded-xl shadow-[0_2px_10px_-3px_rgba(6,81,237,0.1)] border border-gray-200 overflow-hidden hover:shadow-md">';
        orderHtml += '<div class="p-5 cursor-pointer flex justify-between items-start" onclick="toggleDetails(\'' + order.order_id + '\')">';
        orderHtml += '<div class="flex-1">';
        orderHtml += '<div class="flex items-center gap-3 mb-3"><span class="text-[#D32F2F] font-black text-lg">طلب رقم: #' + (order.order_number || '') + '</span><span class="px-3 py-1 rounded-full text-xs font-bold border ' + statusColor + '">' + statusText + '</span></div>';
        orderHtml += '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-3 text-sm">';
        orderHtml += '<div class="text-[#0D1B6D] font-bold text-[15px] lg:col-span-1">المركبة: ' + safeStr(order.vehicle_name) + ' - ' + safeStr(order.vehicle_model) + '</div>';
        orderHtml += '<div class="text-gray-600"><i class="fas fa-industry text-gray-400 ml-1"></i> القاعدة (VIN): <span class="uppercase tracking-wide">' + safeStr(order.vin_number) + '</span></div>';
        orderHtml += '<div class="text-gray-600"><i class="fas fa-map-marker-alt text-gray-400 ml-1"></i> الموقع: ' + safeStr(order.delivery_location) + '</div>';
        
        orderHtml += '<div class="text-gray-600 font-bold" id="client-name-' + order.order_id + '">اسم العميل: جاري الجلب...</div>';
        orderHtml += '<div class="text-gray-600"><i class="fas fa-user text-gray-400 ml-1"></i> الهاتف: ' + safeStr(order.user_number) + '</div>';
        orderHtml += '<div class="text-gray-600" id="client-whats-' + order.order_id + '">رقم الواتساب: جاري الجلب...</div>';
        
        if(isAdminApproval && order.order_receiving_by) {
            orderHtml += '<div class="text-[#E65100] font-bold mt-2 col-span-full border-t border-gray-100 pt-2">مستلم الطلب: ' + safeStr(order.order_receiving_by) + '</div>';
        }
        
        orderHtml += '</div></div>'; 
        
        let iconDir = openOrders.has(order.order_id) ? 'fa-chevron-up' : 'fa-chevron-down';
        orderHtml += '<div class="w-10 h-10 rounded-full flex items-center justify-center bg-gray-50 hover:bg-gray-100 border border-gray-200 ml-2"><i id="icon-' + order.order_id + '" class="fas ' + iconDir + ' text-[#0D1B6D]"></i></div></div>';

        let detailsClass = openOrders.has(order.order_id) ? 'open' : '';
        orderHtml += '<div id="details-' + order.order_id + '" class="order-details ' + detailsClass + ' p-5 border-t border-gray-200 bg-slate-50/50">';
        orderHtml += '<h3 class="font-bold text-blue-600 mb-4 flex items-center gap-2"><i class="fas fa-cogs"></i> القطع والتسعير</h3>';
        orderHtml += '<div class="overflow-x-auto mb-5 rounded-lg border border-gray-200 shadow-sm"><table class="w-full text-sm text-right border-collapse bg-white min-w-[800px]"><thead class="bg-[#0D1B6D] text-white"><tr><th class="p-3">القطعة</th><th class="p-3">النوع/الكمية</th>';
        if(isPending || isAdminApproval) orderHtml += '<th class="p-3">مبلغ العرض</th><th class="p-3">سعر البيع</th>';
        if(isGoing) orderHtml += '<th class="p-3">سعر الشراء</th>';
        orderHtml += '<th class="p-3">التاجر</th><th class="p-3">رقم الفاتورة</th></tr></thead><tbody>' + itemsHtml + '</tbody></table></div>';
        
        if(isPending) orderHtml += '<button class="text-[#4CAF50] font-bold flex items-center gap-2 mb-6 hover:bg-green-50 px-4 py-2 rounded border border-green-200 bg-white" onclick="addNewSubItem(\'' + order.order_id + '\')"><i class="fas fa-plus"></i> إضافة صنف</button>';
        
        if(isPending || isAdminApproval) orderHtml += '<div class="mb-6 w-full md:w-1/4"><label class="block text-sm font-bold text-gray-700 mb-2">رسوم التوصيل:</label><input type="number" class="border border-gray-300 focus:border-[#0D1B6D] p-2.5 rounded w-full font-bold text-lg" value="' + (order.delivery_fees || '') + '" onchange="updateOrderField(\'' + order.order_id + '\', \'delivery_fees\', this.value)"></div>';
        else orderHtml += '<div class="mb-6 font-bold text-[#0D1B6D]">رسوم التوصيل: ' + (order.delivery_fees || 0) + '</div>';

        let actionsHtml = '';
        if(isPending) actionsHtml = '<button onclick="processStatus(\'' + order.order_id + '\', \'canceled\')" class="px-6 py-2.5 text-red-600 font-bold hover:bg-red-50 rounded transition">إلغاء الطلب</button><button onclick="requestAdminApproval(\'' + order.order_id + '\')" class="px-8 py-2.5 bg-[#0D1B6D] text-white font-bold rounded shadow-md hover:bg-blue-900">اعتماد للإدارة</button>';
        else if(isAdminApproval) actionsHtml = '<button onclick="processStatus(\'' + order.order_id + '\', \'pending\')" class="px-6 py-2.5 text-[#E65100] font-bold hover:bg-orange-50 rounded transition">إعادة للمراجعة</button><button onclick="finalApproval(\'' + order.order_id + '\')" class="px-8 py-2.5 bg-[#4CAF50] text-white font-bold rounded shadow-md hover:bg-green-600">اعتماد نهائي</button>';
        else if(isGoing) actionsHtml = '<button onclick="openCancelModal(\'' + order.order_id + '\')" class="px-6 py-2.5 text-red-500 font-bold hover:bg-red-50 border border-red-500 rounded transition">إلغاء (إرجاع)</button><button onclick="finishGoingOrder(\'' + order.order_id + '\')" class="px-8 py-2.5 bg-[#4CAF50] text-white font-bold rounded shadow-md hover:bg-green-600">إنهاء بنجاح</button>';
        
        orderHtml += '<div class="flex justify-end gap-3 mt-8 border-t border-gray-200 pt-5">' + actionsHtml + '</div></div></div>';
        finalHtml += orderHtml;
    });
    container.innerHTML = finalHtml + '</div>';
}

function toggleDetails(orderId) {
    const detailsDiv = document.getElementById('details-' + orderId);
    const icon = document.getElementById('icon-' + orderId);
    if (detailsDiv.classList.contains('open')) {
        detailsDiv.classList.remove('open');
        icon.classList.remove('fa-chevron-up');
        icon.classList.add('fa-chevron-down');
        openOrders.delete(orderId);
    } else {
        detailsDiv.classList.add('open');
        icon.classList.remove('fa-chevron-down');
        icon.classList.add('fa-chevron-up');
        openOrders.add(orderId);
    }
}

function updateOrderField(orderId, field, value) {
    let val = field.includes('fees') ? (parseFloat(value) || 0) : value;
    db.collection('orders').doc(orderId).update({ [field]: val }).catch(()=>{});
}

function updateSubItem(orderId, itemId, field, value) {
    let val = field.includes('price') ? (parseFloat(value) || 0) : value;
    let order = ordersData.find(o => o.order_id === orderId);
    if (order) {
        if (order.items) {
            let itemIndex = order.items.findIndex(i => i.item_id === itemId);
            if (itemIndex !== -1) {
                order.items[itemIndex][field] = val;
                db.collection('orders').doc(orderId).update({ items: order.items }).catch(()=>{});
            }
        }
        if (itemId && !itemId.startsWith("LEGACY-")) {
            db.collection('orders').doc(orderId).collection('items').doc(itemId).set({
                [field]: val
            }, { merge: true }).catch(()=>{});
        }
    }
}

function addNewSubItem(orderId) {
    let order = ordersData.find(o => o.order_id === orderId);
    if (order) {
        let newItemRef = db.collection('orders').doc(orderId).collection('items').doc();
        let newItemId = newItemRef.id;
        let baseItem = order.items && order.items.length > 0 ? order.items[0] : null;
        
        let newItem = {
            item_id: newItemId,
            part_name: "صنف جديد",
            quality_type: baseItem ? baseItem.quality_type : "-",
            quantity: 1,
            quotation_price: 0,
            selling_price: 0,
            purchase_price: 0,
            trader_name: "",
            quotation_number: "",
            invoice_number: "",
            description: "",
            comments: ""
        };
        
        openOrders.add(orderId);
        
        if (order.items) {
            order.items.push(newItem);
            db.collection('orders').doc(orderId).update({ items: order.items }).catch(()=>{});
        }
        newItemRef.set(newItem).catch(()=>{});
    }
}

function deleteItem(orderId, itemId) {
    if (confirm("هل أنت متأكد من حذف هذا الصنف؟")) {
        let order = ordersData.find(o => o.order_id === orderId);
        openOrders.add(orderId);
        if (order && order.items) {
            order.items = order.items.filter(i => i.item_id !== itemId);
            db.collection('orders').doc(orderId).update({ items: order.items }).catch(()=>{});
        }
        if (itemId && !itemId.startsWith("LEGACY-")) {
            db.collection('orders').doc(orderId).collection('items').doc(itemId).delete().catch(()=>{});
        }
    }
}

function saveQuotationPrice(orderId, itemId) {
    let order = ordersData.find(o => o.order_id === orderId);
    if(!order) return;
    let item = order.items.find(i => i.item_id === itemId);
    if(!item) return;

    if(!item.quotation_price || !item.trader_name || !item.quotation_number) {
        alert("الرجاء تعبئة مبلغ العرض واسم التاجر ورقم الفاتورة");
        return;
    }
    let ref = db.collection("quotation_prices").doc();
    ref.set({
        quotation_id: ref.id,
        part_name: item.part_name,
        quotation_number: item.quotation_number,
        quotation_price: parseFloat(item.quotation_price),
        trader_name: item.trader_name,
        created_at: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => alert("تمت إضافة عرض السعر بنجاح"));
}

function processStatus(orderId, newStatus) {
    if (newStatus === 'canceled' && !confirm("هل أنت متأكد من إلغاء الفاتورة؟")) return;
    db.collection('orders').doc(orderId).update({ 
        order_status: newStatus,
        order_status_date: firebase.firestore.FieldValue.serverTimestamp()
    });
    if(newStatus === 'canceled') removeAdminAlarm(orderId);
}

// دالة الاعتماد والتي تحفظ اسم المستلم من المتغير adminUsername المرتبط بـ sessionStorage
function requestAdminApproval(orderId) {
    let order = ordersData.find(o => o.order_id === orderId);
    if(order && order.items && order.items.some(i => !i.trader_name)) {
        alert("الرجاء اختيار اسم التاجر لجميع الأصناف"); return;
    }
    db.collection('orders').doc(orderId).update({ 
        order_status: 'waiting admin approvel',
        order_status_date: firebase.firestore.FieldValue.serverTimestamp(),
        order_receiving_by: adminUsername
    });
}

async function finalApproval(orderId) {
    let order = ordersData.find(o => o.order_id === orderId);
    if(!order) return;
    if(order.items && order.items.some(i => !i.trader_name)) {
        alert("الرجاء اختيار اسم التاجر لجميع الأصناف"); return;
    }
    await db.collection('orders').doc(orderId).update({ 
        order_status: 'waiting for approvel',
        order_status_date: firebase.firestore.FieldValue.serverTimestamp()
    });
    removeAdminAlarm(order.order_number);
    sendUserAlarm(order.user_id, order.order_number, "فاتورة جاهزة", "تم تسعير طلبك رقم " + order.order_number + "، يرجى مراجعته.");
}

async function finishGoingOrder(orderId) {
    let order = ordersData.find(o => o.order_id === orderId);
    if(!order) return;
    await db.collection('orders').doc(orderId).update({ 
        order_status: 'completed',
        order_status_date: firebase.firestore.FieldValue.serverTimestamp()
    });
    removeAdminAlarm(order.order_number);
    sendUserAlarm(order.user_id, order.order_number, "تم التوصيل", "تم توصيل طلبك رقم " + order.order_number + " بنجاح.");
}

function openCancelModal(orderId) {
    let order = ordersData.find(o => o.order_id === orderId);
    if(!order) return;
    document.getElementById('cancelOrderId').value = order.order_id;
    document.getElementById('cancelOrderUserId').value = order.user_id;
    document.getElementById('cancelOrderNumber').value = order.order_number;
    document.getElementById('cancelNotes').value = "";
    document.getElementById('incrementRejection').checked = false;
    document.getElementById('cancelModal').style.display = 'flex';
    document.getElementById('cancelModal').classList.remove('hidden');
}

function closeCancelModal() {
    document.getElementById('cancelModal').style.display = 'none';
    document.getElementById('cancelModal').classList.add('hidden');
}

async function confirmCancelGoingOrder() {
    let orderId = document.getElementById('cancelOrderId').value;
    let userId = document.getElementById('cancelOrderUserId').value;
    let orderNumber = document.getElementById('cancelOrderNumber').value;
    let notes = document.getElementById('cancelNotes').value;
    let incReject = document.getElementById('incrementRejection').checked;

    if(!notes.trim()) { alert("الرجاء كتابة سبب الإلغاء"); return; }

    await db.collection('orders').doc(orderId).update({
        order_status: 'canceled',
        order_status_date: firebase.firestore.FieldValue.serverTimestamp(),
        approval_notes: notes
    });

    if(incReject && userId) {
        await db.collection('users').doc(userId).update({
            number_of_rejections: firebase.firestore.FieldValue.increment(1)
        });
    }

    removeAdminAlarm(orderNumber);
    sendUserAlarm(userId, orderNumber, "تم إلغاء الطلب", "تم إلغاء طلبك رقم " + orderNumber + " من قبل الإدارة.");
    closeCancelModal();
}

async function removeAdminAlarm(orderNumber) {
    try {
        let snap = await db.collection('admin_alarm').where('order_number', '==', parseInt(orderNumber)).get();
        snap.forEach(doc => doc.ref.delete());
    } catch(e){}
}

async function sendUserAlarm(userId, orderNumber, title, message) {
    if(!userId) return;
    try {
        let userDoc = await db.collection('users').doc(userId).get();
        let token = userDoc.exists ? userDoc.data().fcm_token : "";
        let ref = db.collection('user_alarm').doc();
        ref.set({
            alarm_id: ref.id,
            date: firebase.firestore.FieldValue.serverTimestamp(),
            order_number: parseInt(orderNumber),
            title: title,
            message: message,
            receiver_id: userId,
            fcm_token: token || "",
            isRead: false,
            type: "order"
        });
    } catch(e){}
}

    Notification.requestPermission().then((permission) => {

if(messaging) {
    messaging.onMessage((payload) => {
        const title = payload.data?.title || payload.notification?.title || "إشعار جديد";
        const message = payload.data?.message || payload.notification?.body || "";
        showFCMToast(title, message);
    });
}

function showFCMToast(title, message) {
    let container = document.getElementById('fcm-toast-container');
    if (!container) { 
        container = document.createElement('div'); 
        container.id = 'fcm-toast-container'; 
        container.className = 'fixed top-4 left-4 z-50 flex flex-col gap-3'; 
        document.body.appendChild(container); 
    }
    const toast = document.createElement('div');
    toast.className = 'bg-[#0D1B6D] text-white px-5 py-4 rounded-xl shadow-2xl transform transition-all duration-500 translate-y-[-100%] opacity-0 flex items-start gap-4 w-80 cursor-pointer border border-blue-800';
    toast.onclick = () => { currentTab = 'pending'; fetchOrders(); toast.remove(); };
    toast.innerHTML = '<div class="bg-blue-500/20 p-3 rounded-full shrink-0"><i class="fas fa-bell text-blue-300 text-xl animate-pulse"></i></div><div class="flex-1"><h4 class="font-bold text-sm mb-1 text-blue-100">' + title + '</h4><p class="text-xs text-gray-300 leading-relaxed">' + message + '</p></div><button class="shrink-0 text-gray-400 hover:text-white" onclick="event.stopPropagation(); this.parentElement.remove()"><i class="fas fa-times"></i></button>';
    container.appendChild(toast);
    setTimeout(() => toast.classList.remove('translate-y-[-100%]', 'opacity-0'), 100);
    setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-[-100%]'); setTimeout(() => toast.remove(), 500); }, 6000);
}
