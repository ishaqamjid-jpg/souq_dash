<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الحسابات والسندات | Souq app</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .hidden-element { display: none !important; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); }
        .fab-button {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            z-index: 40;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden">

    <!-- القائمة الجانبية (Sidebar) -->
    <aside class="w-64 bg-gray-900 text-white flex flex-col shrink-0 shadow-lg z-20">
        <div class="h-16 flex items-center justify-center font-black text-2xl bg-gray-950 border-b border-gray-800">
            Souq app
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto custom-scrollbar">
            <a href="dashboard.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">الرئيسية</a>
            <a href="orders.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">إدارة الطلبات</a>
            <a href="reports.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">التقارير والإحصائيات</a>
            <a href="ads.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">إدارة الإعلانات</a>
            <a href="trader.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">إدارة التجار</a>
            <a href="clients.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">عملاء التطبيق</a>
            <a href="constant.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">إدارة الثوابت</a>
            <a href="users.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">موظفو النظام</a>
            <a href="quotations.html" class="block px-4 py-3 hover:bg-gray-800 rounded-lg transition-colors font-medium">فواتير سعر</a>
            <!-- الزر النشط الآن هو الحسابات والسندات -->
            <a href="accounting.html" class="block px-4 py-3 bg-blue-600 shadow-md rounded-lg transition-colors font-bold">الحسابات والسندات</a>
        </nav>
        <div class="p-4 border-t border-gray-800">
            <button class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-lg transition-colors shadow">
                تسجيل الخروج
            </button>
        </div>
    </aside>

    <!-- منطقة المحتوى الرئيسية -->
    <div class="flex-1 flex flex-col overflow-hidden relative">
        
        <header class="h-16 bg-[#0D1B6D] text-white shadow-sm flex items-center justify-between px-8 shrink-0 z-10">
            <h2 class="text-xl font-bold">الحسابات والسندات</h2>
            <div class="flex items-center gap-6">
                <button onclick="renderAccounting()" class="text-white hover:text-gray-200 font-bold transition flex items-center gap-2">
                    <i class="fas fa-sync-alt"></i> تحديث
                </button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto bg-gray-50 p-6 relative">
            
            <div class="max-w-5xl mx-auto space-y-6">
                <!-- بطاقة الإحصائيات העליונה -->
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 flex flex-wrap justify-between items-center text-center gap-4">
                    <div class="flex-1">
                        <div class="text-gray-500 text-sm font-bold mb-1">الرصيد الصافي</div>
                        <div id="stat-net" class="text-2xl font-black text-[#2E7D32]" dir="ltr">0</div>
                    </div>
                    <div class="w-px h-12 bg-gray-200 hidden md:block"></div>
                    <div class="flex-1">
                        <div class="text-gray-500 text-sm font-bold mb-1">إجمالي القبض</div>
                        <div id="stat-income" class="text-xl font-bold text-[#2E7D32]" dir="ltr">0</div>
                    </div>
                    <div class="w-px h-12 bg-gray-200 hidden md:block"></div>
                    <div class="flex-1">
                        <div class="text-gray-500 text-sm font-bold mb-1">إجمالي الصرف</div>
                        <div id="stat-expense" class="text-xl font-bold text-red-600" dir="ltr">0</div>
                    </div>
                </div>

                <!-- شريط البحث برقم السند -->
                <div class="relative">
                    <i class="fas fa-search absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input type="number" id="search-input" onkeyup="renderAccounting()" placeholder="بحث برقم السند..." class="w-full bg-white border border-gray-300 text-gray-900 rounded-xl shadow-sm focus:ring-[#0D1B6D] focus:border-[#0D1B6D] block pr-12 p-3.5 outline-none transition-colors">
                </div>

                <!-- حاوية قائمة السندات -->
                <div id="accountingContainer" class="space-y-4 pb-24"></div>
            </div>

        </main>

        <!-- زر الإضافة العائم (FAB) -->
        <button onclick="openAccountingModal()" class="fab-button px-6 py-4 bg-[#4CAF50] hover:bg-green-600 text-white rounded-full shadow-lg flex items-center justify-center gap-3 transition-transform hover:scale-105 font-bold">
            <i class="fas fa-plus text-lg"></i> سند جديد
        </button>
    </div>

    <!-- ======================= النوافذ المنبثقة (Modals) ======================= -->

    <!-- نافذة إضافة / تعديل سند -->
    <div id="acc-modal" class="fixed inset-0 modal-overlay z-50 hidden-element flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto flex flex-col">
            <div class="p-6 border-b border-gray-200 flex justify-between items-center sticky top-0 bg-white z-10">
                <h3 id="modal-title" class="text-xl font-bold text-[#0D1B6D]">إضافة سند جديد</h3>
                <button onclick="closeModal('acc-modal')" class="text-gray-400 hover:text-red-500 transition-colors"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="acc-id">
                
                <div>
                    <label class="block text-sm font-bold text-gray-500 mb-1">رقم السند</label>
                    <input type="text" id="acc-doc-num" readonly placeholder="تلقائي" class="w-full bg-gray-100 border border-gray-200 text-gray-500 p-2.5 rounded-lg outline-none cursor-not-allowed font-bold" dir="ltr">
                </div>
                
                <div class="border-t border-gray-100 pt-4 mt-2">
                    <label class="block text-sm font-bold text-gray-700 mb-2">نوع السند:</label>
                    <div class="flex gap-6">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="acc-type" value="قبض" checked class="w-4 h-4 text-green-600">
                            <span class="font-bold text-[#2E7D32]">قبض (دخول أموال)</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="acc-type" value="صرف" class="w-4 h-4 text-red-600">
                            <span class="font-bold text-red-600">صرف (خروج أموال)</span>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">المبلغ <span class="text-red-500">*</span></label>
                    <input type="number" id="acc-amount" step="any" class="w-full border border-gray-300 p-2.5 rounded-lg focus:outline-none focus:border-[#0D1B6D] text-left" dir="ltr" placeholder="0.0">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">التفاصيل / البيان <span class="text-red-500">*</span></label>
                    <textarea id="acc-details" rows="3" class="w-full border border-gray-300 p-2.5 rounded-lg focus:outline-none focus:border-[#0D1B6D] resize-none"></textarea>
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">تاريخ السند</label>
                    <input type="date" id="acc-date" class="w-full border border-gray-300 p-2.5 rounded-lg focus:outline-none focus:border-[#0D1B6D]">
                </div>

            </div>
            <div class="p-6 border-t border-gray-200 bg-gray-50 flex justify-end gap-3 rounded-b-2xl sticky bottom-0">
                <button onclick="closeModal('acc-modal')" class="px-6 py-2.5 text-gray-600 font-bold hover:bg-gray-200 rounded-lg transition-colors">إلغاء</button>
                <button onclick="saveAccounting()" class="px-8 py-2.5 bg-[#0D1B6D] text-white font-bold rounded-lg shadow-md hover:bg-blue-900 transition-colors">حفظ السند</button>
            </div>
        </div>
    </div>

    <!-- نافذة تأكيد الحذف -->
    <div id="delete-modal" class="fixed inset-0 modal-overlay z-50 hidden-element flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 text-center">
            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-exclamation-triangle text-3xl text-red-600"></i>
            </div>
            <h3 class="text-xl font-bold text-gray-800 mb-2">تأكيد الحذف</h3>
            <p class="text-gray-500 mb-6" id="delete-message">هل أنت متأكد من رغبتك في حذف هذا السند نهائياً؟</p>
            <div class="flex gap-3 justify-center">
                <button onclick="closeModal('delete-modal')" class="flex-1 px-4 py-2 text-gray-600 font-bold bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">إلغاء</button>
                <button id="confirm-delete-btn" class="flex-1 px-4 py-2 bg-red-600 text-white font-bold hover:bg-red-700 rounded-lg transition-colors">حذف</button>
            </div>
        </div>
    </div>

    <!-- إشعار التنبيه (Toast) -->
    <div id="toast-message" class="fixed top-4 left-1/2 transform -translate-x-1/2 text-white px-6 py-3 rounded-xl shadow-lg hidden-element transition-opacity z-50 flex items-center gap-3">
        <i id="toast-icon" class="fas fa-check-circle text-xl"></i> <span id="toast-text" class="font-bold"></span>
    </div>

    <script>
        // --- 1. البيانات الوهمية للمحاكاة ---
        let accountingData = [
            { documentId: "DOC-1", doc_number: 1, type: "قبض", amount: 50000, details: "دفعة من العميل أحمد محمد لحساب الفاتورة رقم 1001", date: "2023-10-01" },
            { documentId: "DOC-2", doc_number: 2, type: "صرف", amount: 15000, details: "شراء قطع غيار من مؤسسة النور", date: "2023-10-02" },
            { documentId: "DOC-3", doc_number: 3, type: "قبض", amount: 25000, details: "سداد متبقي من مؤسسة العليمي", date: "2023-10-05" }
        ];

        let deleteTargetId = null;

        // --- 2. رسم بيانات السندات والإحصائيات ---
        function renderAccounting() {
            let container = document.getElementById('accountingContainer');
            let query = document.getElementById('search-input').value.trim();

            let totalIncome = 0;
            let totalExpense = 0;
            
            let htmlStr = '';
            let count = 0;

            for (let i = 0; i < accountingData.length; i++) {
                let acc = accountingData[i];
                
                // حساب الإحصائيات (تحسب من جميع السندات حتى لو كان هناك فلتر)
                if (acc.type === 'قبض') totalIncome += acc.amount;
                else if (acc.type === 'صرف') totalExpense += acc.amount;

                // تطبيق فلتر البحث برقم السند
                if (query && acc.doc_number.toString() !== query) continue;
                
                count++;

                let isIncome = acc.type === 'قبض';
                let colorPrimary = isIncome ? 'text-[#2E7D32]' : 'text-[#D32F2F]';
                let colorBg = isIncome ? 'bg-[#E8F5E9]' : 'bg-[#xFFFFEBEE]';
                let iconClass = isIncome ? 'fa-arrow-down' : 'fa-arrow-up';

                htmlStr += '<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 hover:shadow-md transition-shadow">';
                
                htmlStr += '<div class="flex items-start gap-4 flex-1">';
                // أيقونة السند
                htmlStr += '<div class="w-12 h-12 rounded-xl flex items-center justify-center shrink-0 ' + colorBg + ' ' + colorPrimary + '">';
                htmlStr += '<i class="fas ' + iconClass + ' text-xl"></i>';
                htmlStr += '</div>';

                // التفاصيل
                htmlStr += '<div class="flex-1">';
                htmlStr += '<div class="flex justify-between items-center mb-1">';
                htmlStr += '<h3 class="font-bold text-lg ' + colorPrimary + '">سند ' + acc.type + ' #' + acc.doc_number + '</h3>';
                htmlStr += '<span class="font-black text-lg" dir="ltr">' + acc.amount + '</span>';
                htmlStr += '</div>';
                htmlStr += '<p class="text-gray-700 text-sm mb-2">' + acc.details + '</p>';
                htmlStr += '<div class="text-gray-500 text-xs flex items-center gap-1"><i class="fas fa-calendar-alt w-3"></i> ' + acc.date + '</div>';
                htmlStr += '</div>';
                htmlStr += '</div>';

                // الأزرار
                htmlStr += '<div class="flex gap-2 self-end md:self-center shrink-0">';
                htmlStr += '<button onclick="openAccountingModal(\'' + acc.documentId + '\')" class="w-9 h-9 rounded-full bg-blue-50 text-blue-600 hover:bg-blue-100 flex items-center justify-center transition-colors"><i class="fas fa-edit text-sm"></i></button>';
                htmlStr += '<button onclick="attemptDelete(\'' + acc.documentId + '\', \'' + acc.doc_number + '\')" class="w-9 h-9 rounded-full bg-red-50 text-red-600 hover:bg-red-100 flex items-center justify-center transition-colors"><i class="fas fa-trash text-sm"></i></button>';
                htmlStr += '</div>';

                htmlStr += '</div>';
            }

            if(count === 0) {
                htmlStr = '<div class="text-center py-20 text-gray-400"><i class="fas fa-receipt text-6xl mb-4 opacity-50"></i><h3 class="text-xl font-bold">لا يوجد سند بهذا الرقم</h3></div>';
            }

            container.innerHTML = htmlStr;

            // تحديث الإحصائيات العلوية
            let netTotal = totalIncome - totalExpense;
            let statNet = document.getElementById('stat-net');
            
            document.getElementById('stat-income').innerText = totalIncome;
            document.getElementById('stat-expense').innerText = totalExpense;
            statNet.innerText = netTotal;
            
            // تغيير لون الرصيد الصافي بناءً على قيمته
            if (netTotal >= 0) {
                statNet.className = "text-2xl font-black text-[#2E7D32]";
            } else {
                statNet.className = "text-2xl font-black text-red-600";
            }
        }

        // --- 3. التحكم بالنوافذ المنبثقة (Modals) ---
        function openModal(id) { document.getElementById(id).classList.remove('hidden-element'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden-element'); }

        function openAccountingModal(id) {
            let titleEl = document.getElementById('modal-title');
            let idInput = document.getElementById('acc-id');
            let docNumInput = document.getElementById('acc-doc-num');
            let amountInput = document.getElementById('acc-amount');
            let detailsInput = document.getElementById('acc-details');
            let dateInput = document.getElementById('acc-date');

            if (id) {
                // وضع التعديل
                titleEl.innerText = "تعديل السند";
                for (let i = 0; i < accountingData.length; i++) {
                    if (accountingData[i].documentId === id) {
                        let acc = accountingData[i];
                        idInput.value = acc.documentId;
                        docNumInput.value = acc.doc_number;
                        amountInput.value = acc.amount;
                        detailsInput.value = acc.details;
                        dateInput.value = acc.date;
                        document.querySelector('input[name="acc-type"][value="' + acc.type + '"]').checked = true;
                        break;
                    }
                }
            } else {
                // وضع الإضافة
                titleEl.innerText = "إضافة سند جديد";
                idInput.value = "";
                docNumInput.value = ""; // تلقائي
                amountInput.value = "";
                detailsInput.value = "";
                // تحديد تاريخ اليوم كافتراضي
                let today = new Date().toISOString().split('T')[0];
                dateInput.value = today;
                document.querySelector('input[name="acc-type"][value="قبض"]').checked = true;
            }
            openModal('acc-modal');
        }

        // --- 4. العمليات (حفظ وتأكيد حذف) ---
        function saveAccounting() {
            let id = document.getElementById('acc-id').value;
            let amountStr = document.getElementById('acc-amount').value.trim();
            let details = document.getElementById('acc-details').value.trim();
            let dateStr = document.getElementById('acc-date').value;
            let type = document.querySelector('input[name="acc-type"]:checked').value;

            if(!amountStr || !details || !dateStr) {
                showToast("يرجى تعبئة المبلغ والتفاصيل والتاريخ", false);
                return;
            }

            let amount = parseFloat(amountStr) || 0;

            if (id) {
                // تعديل: نحتفظ بنفس رقم السند
                for (let i = 0; i < accountingData.length; i++) {
                    if (accountingData[i].documentId === id) {
                        accountingData[i].type = type;
                        accountingData[i].amount = amount;
                        accountingData[i].details = details;
                        accountingData[i].date = dateStr;
                        break;
                    }
                }
            } else {
                // إضافة: جلب أعلى رقم سند لزيادته
                let maxDocNum = 0;
                for (let i = 0; i < accountingData.length; i++) {
                    if (accountingData[i].doc_number > maxDocNum) {
                        maxDocNum = accountingData[i].doc_number;
                    }
                }

                let newRecord = {
                    documentId = "DOC-" + Date.now(),
                    doc_number: maxDocNum + 1, // توليد الرقم تلقائياً
                    type: type,
                    amount: amount,
                    details: details,
                    date: dateStr
                };
                // إضافة السند في البداية
                accountingData.unshift(newRecord);
            }

            closeModal('acc-modal');
            renderAccounting();
            showToast(id ? "تم تعديل السند بنجاح" : "تم حفظ السند الجديد بنجاح", true);
        }

        function attemptDelete(id, docNum) {
            deleteTargetId = id;
            document.getElementById('delete-message').innerText = "هل أنت متأكد من رغبتك في حذف السند رقم " + docNum + " نهائياً؟";
            document.getElementById('confirm-delete-btn').onclick = executeDelete;
            openModal('delete-modal');
        }

        function executeDelete() {
            for (let i = 0; i < accountingData.length; i++) {
                if (accountingData[i].documentId === deleteTargetId) {
                    accountingData.splice(i, 1);
                    break;
                }
            }
            closeModal('delete-modal');
            renderAccounting();
            showToast("تم حذف السند بنجاح", true);
        }

        // إشعار التنبيه (Toast)
        function showToast(message, isSuccess) {
            let toast = document.getElementById('toast-message');
            let icon = document.getElementById('toast-icon');
            
            document.getElementById('toast-text').innerText = message;
            
            if (isSuccess) {
                toast.className = "fixed top-4 left-1/2 transform -translate-x-1/2 bg-[#4CAF50] text-white px-6 py-3 rounded-xl shadow-lg transition-opacity z-50 flex items-center gap-3";
                icon.className = "fas fa-check-circle text-xl";
            } else {
                toast.className = "fixed top-4 left-1/2 transform -translate-x-1/2 bg-red-600 text-white px-6 py-3 rounded-xl shadow-lg transition-opacity z-50 flex items-center gap-3";
                icon.className = "fas fa-exclamation-triangle text-xl";
            }

            toast.classList.remove('hidden-element');
            setTimeout(function() {
                toast.classList.add('hidden-element');
            }, 4000);
        }

        // التهيئة الأولى عند تحميل الصفحة (سورتينج زمني للبيانات الوهمية)
        window.onload = function() {
            accountingData.sort(function(a, b) {
                return new Date(b.date) - new Date(a.date);
            });
            renderAccounting();
        };
    </script>
</body>
</html>
